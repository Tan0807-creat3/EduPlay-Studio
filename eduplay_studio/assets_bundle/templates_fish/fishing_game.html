<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ i18n_title }}</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(180deg, #cdeffd 0%, #a2e0f8 30%, #6ecae8 65%, #3baede 100%);
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(180deg, #caeefc 0%, #9be0f7 28%, #67cbe9 65%, #34a9dc 100%);
        }
        .layer {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        #layer-far { z-index: 0; }
        #layer-mid { z-index: 3; }
        #layer-near { z-index: 6; }
        #layer-bottom { z-index: 2; }
        #background {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.0;
        }
        .vignette { position:absolute; inset:0; pointer-events:none; z-index: 20; background: radial-gradient(120% 100% at 50% 50%, rgba(255,255,255,0) 60%, rgba(255,255,255,0.18) 100%); }
        .caustics { position:absolute; inset:0; pointer-events:none; z-index: 5; mix-blend-mode: soft-light; opacity: 0.45; background-image: radial-gradient(circle at 30% 10%, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 40%), radial-gradient(circle at 70% 20%, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0) 45%); animation: caustics 12s infinite linear; }
        @keyframes caustics { 0% { background-position: 0 0, 0 0; } 100% { background-position: 300px 0, -300px 0; } }
        .rays { position:absolute; inset:0; pointer-events:none; z-index: 4; background-image: linear-gradient(115deg, rgba(255,255,255,0.12) 0 12%, rgba(255,255,255,0) 12% 32%, rgba(255,255,255,0.1) 32% 42%, rgba(255,255,255,0) 42% 62%, rgba(255,255,255,0.1) 62% 72%, rgba(255,255,255,0) 72%); transform: translateY(-20%); animation: rays 8s infinite alternate ease-in-out; }
        @keyframes rays { from { transform: translateY(-20%) rotate(0.5deg); } to { transform: translateY(0%) rotate(-0.5deg); } }
        
        /* Interactive Clickable Fish - PROMINENT & LARGE */
        .fish {
            position: absolute;
            cursor: pointer;
            transition: transform 0.15s ease, filter 0.2s ease;
            will-change: transform;
            user-select: none;
            z-index: 35; /* Above background elements and seaweed */
            filter: drop-shadow(0 0 12px rgba(255, 235, 59, 0.95)) drop-shadow(0 0 24px rgba(56, 189, 248, 0.85)) drop-shadow(0 8px 12px rgba(0,0,0,0.45));
            animation: fishPulseGlow 2.5s infinite ease-in-out;
        }
        @keyframes fishPulseGlow {
            0%, 100% { filter: drop-shadow(0 0 10px rgba(255, 235, 59, 0.9)) drop-shadow(0 0 20px rgba(56, 189, 248, 0.8)) drop-shadow(0 6px 12px rgba(0, 0, 0, 0.4)); }
            50% { filter: drop-shadow(0 0 20px rgba(255, 255, 255, 1)) drop-shadow(0 0 35px rgba(245, 158, 11, 0.95)) drop-shadow(0 10px 18px rgba(0, 0, 0, 0.5)); }
        }
        .fish:hover {
            transform: scale(1.22) !important;
            filter: drop-shadow(0 0 24px rgba(255, 255, 255, 1)) drop-shadow(0 0 42px rgba(245, 158, 11, 1)) drop-shadow(0 12px 22px rgba(0,0,0,0.6));
            z-index: 40;
        }
        
        /* Non-interactive Background Fish (Cá nền - mờ, nhỏ, bơi nhẹ nhàng) */
        .bg-fish {
            position: absolute;
            pointer-events: none;
            z-index: 3;
            opacity: 0.60;
            filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.2));
            will-change: transform, left, top;
        }
        
        .bubble {
            position: absolute;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="rgba(255,255,255,0.35)" stroke="rgba(255,255,255,0.6)" stroke-width="1.2"/></svg>');
            background-size: contain;
            background-repeat: no-repeat;
            will-change: transform;
            z-index: 12;
            border-radius: 50%;
            background-color: rgba(255,255,255,0.15);
            box-shadow: inset 0 0 6px rgba(255,255,255,0.4);
            filter: drop-shadow(0 0 6px rgba(255,255,255,0.4));
        }
        .seaweed {
            position: absolute;
            pointer-events: none;
            will-change: transform;
            z-index: 10;
            filter: drop-shadow(0 3px 3px rgba(0,0,0,0.3));
        }
        .decor { position:absolute; pointer-events:none; }
        .rock { filter: drop-shadow(0 4px 3px rgba(0,0,0,0.4)); z-index:11; }
        .tiny-fish { position:absolute; z-index:2; opacity:0.55; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.2)); }
        .jelly { position:absolute; width:22px; height:22px; border-radius:50% 50% 40% 40%; background: radial-gradient(circle at 50% 30%, rgba(255,255,255,0.2), rgba(181,229,255,0.35) 40%, rgba(135,206,250,0.2)); box-shadow: 0 1px 6px rgba(0,0,0,0.18); opacity:0.4; z-index:4; }
        .jelly::after { content:""; position:absolute; left:8px; right:8px; bottom:-12px; height:16px; background: linear-gradient(180deg, rgba(181,229,255,0.6), rgba(135,206,250,0.4)); border-radius:8px; filter: blur(0.5px); }
        .ambient { position:absolute; z-index:2; opacity:0.35; filter: blur(0.2px) saturate(70%); }
        .ambient.star { width:16px; height:16px; }
        .ambient.star::before, .ambient.star::after { content:""; position:absolute; left:7px; top:0; width:2px; height:16px; background:#ffd966; box-shadow:0 0 6px rgba(255,217,102,0.8); transform-origin:center; }
        .ambient.star::before { transform: rotate(36deg); }
        .ambient.star::after { transform: rotate(-36deg); }
        .ambient.dot { width:12px; height:6px; border-radius:50% 50% 40% 40%; background: radial-gradient(circle at 40% 40%, rgba(255,255,255,0.8), rgba(255,255,255,0.2)); }
        
        /* Realistic Layered Seabed Terrain Matching Kenney Style 100% */
        #terrain-container {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 130px;
            pointer-events: none;
            z-index: 6;
            overflow: hidden;
        }
        .terrain-layer {
            position: absolute;
            left: 0;
            width: 100%;
            pointer-events: none;
        }
        .terrain-dirt-bottom {
            bottom: 0;
            height: 95px;
            background: linear-gradient(180deg, #814f28 0%, #63391b 100%);
            clip-path: polygon(0 25%, 15% 15%, 35% 32%, 58% 12%, 80% 28%, 100% 18%, 100% 100%, 0 100%);
            z-index: 5;
            box-shadow: inset 0 6px 10px rgba(0,0,0,0.35);
        }
        .terrain-sand-top {
            bottom: 18px;
            height: 75px;
            background: linear-gradient(180deg, #e5c178 0%, #c39c4a 100%);
            clip-path: polygon(0 15%, 25% 38%, 48% 14%, 72% 35%, 100% 10%, 100% 100%, 0 100%);
            z-index: 7;
            box-shadow: inset 0 4px 8px rgba(255,255,255,0.45);
        }
        #question-panel {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(255, 255, 255, 0.98);
            border: 2px solid #10B981;
            border-radius: 22px;
            padding: 58px 28px 24px 28px;
            width: 88%;
            max-width: 620px;
            z-index: 100;
            color: #0F172A;
            box-shadow: 0 20px 45px rgba(148, 163, 184, 0.22);
            max-height: min(78vh, 760px);
            overflow-y: auto;
            overflow-x: hidden;
        }
        #question-panel.matching-mode {
            width: 92%;
            max-width: 760px;
        }
        #question-panel.open { animation: panelIn 180ms ease-out; }
        @keyframes panelIn { from { transform: translate(-50%, -50%) scale(0.98); opacity: 0.0; } to { transform: translate(-50%, -50%) scale(1); opacity: 1.0; } }
        #question-timer {
            position: absolute;
            top: 14px;
            left: 20px;
            background: linear-gradient(135deg, #eef2ff 0%, #e0e7ff 100%);
            color: #1e1b4b;
            border: 1px solid #a5b4fc;
            padding: 5px 12px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 0.95rem;
            box-shadow: 0 2px 8px rgba(99, 102, 241, 0.15);
            display: none;
            z-index: 105;
        }
        #question-fish-badge {
            position: absolute;
            top: 12px;
            right: 18px;
            width: 64px;
            height: 64px;
            background: radial-gradient(circle, #ffffff 50%, #e0f2fe 100%);
            border: 3px solid #0ea5e9;
            border-radius: 50%;
            box-shadow: 0 8px 20px rgba(125, 211, 252, 0.36), inset 0 0 10px rgba(56, 189, 248, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 7px;
            z-index: 110;
            animation: fishBadgePop 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        #question-fish-badge img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.25));
        }
        @keyframes fishBadgePop {
            0% { transform: scale(0) rotate(-15deg); opacity: 0; }
            80% { transform: scale(1.15) rotate(5deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        #question-text {
            font-size: 1.18em;
            font-weight: 600;
            line-height: 1.55;
            margin-bottom: 22px;
            text-align: center;
            padding: 0 92px 0 24px;
            color: #0F172A;
        }
        #question-text.fill-blank-inline {
            padding-right: 24px;
        }
        .question-inline-wrap {
            display: inline-flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 8px;
            max-width: 100%;
        }
        .question-inline-text {
            white-space: pre-wrap;
            word-break: break-word;
        }
        #question-image-container {
            display: none;
            margin: 0 auto 18px auto;
            max-width: min(280px, 100%);
            text-align: center;
        }
        #question-image {
            max-width: 100%;
            max-height: 180px;
            border-radius: 14px;
            object-fit: contain;
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.16);
            border: 1px solid rgba(125, 211, 252, 0.65);
            background: rgba(255, 255, 255, 0.92);
        }
        #options-container { width: 100%; margin-top: 4px; }
        #options-container.options-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }
        #options-container.options-stack { display: block; }
        .matching-instruction {
            margin: 0 0 14px;
            text-align: center;
            font-size: 0.95rem;
            color: #475569;
        }
        .matching-board {
            position: relative;
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 88px;
            width: 100%;
            padding: 10px 10px 6px;
            box-sizing: border-box;
        }
        .matching-column {
            position: relative;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 2;
        }
        .matching-column-title {
            font-size: 0.92rem;
            font-weight: 800;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            color: #0369a1;
            text-align: center;
        }
        .match-card {
            min-height: 56px;
            padding: 12px 14px;
            border-radius: 16px;
            border: 2px solid rgba(147, 197, 253, 0.65);
            background: linear-gradient(135deg, rgba(255,255,255,0.96), rgba(240,249,255,0.96));
            box-shadow: 0 12px 24px rgba(148, 163, 184, 0.16);
            font-size: 0.98rem;
            font-weight: 600;
            line-height: 1.4;
            color: #0f172a;
            text-align: left;
            cursor: pointer;
            transition: transform 120ms ease, box-shadow 120ms ease, border-color 120ms ease, background 120ms ease;
            word-break: break-word;
        }
        .match-card:hover {
            transform: translateY(-1px);
            box-shadow: 0 16px 26px rgba(148, 163, 184, 0.18);
            border-color: rgba(14, 165, 233, 0.85);
        }
        .match-card.selected {
            border-color: #0ea5e9;
            background: linear-gradient(135deg, rgba(224, 242, 254, 1), rgba(186, 230, 253, 0.95));
            box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.18), 0 16px 26px rgba(14, 165, 233, 0.16);
        }
        .match-card.matched {
            border-color: #10b981;
            background: linear-gradient(135deg, rgba(236, 253, 245, 1), rgba(209, 250, 229, 0.96));
        }
        .match-card:disabled {
            opacity: 1;
        }
        .match-link-layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: visible;
            z-index: 1;
        }
        .match-link-path {
            fill: none;
            stroke: rgba(14, 165, 233, 0.95);
            stroke-width: 4;
            stroke-linecap: round;
            filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.35));
        }
        .match-link-node {
            fill: #ffffff;
            stroke: #0ea5e9;
            stroke-width: 3;
        }
        .text-answer-layout {
            width: 100%;
            display: flex;
            justify-content: center;
        }
        .text-answer-wrap {
            width: 100%;
            display: flex;
            justify-content: center;
        }
        .text-input {
            display: block;
            width: min(92%, 560px);
            max-width: 100%;
            margin: 0 auto;
            box-sizing: border-box;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid rgba(147,197,253,0.75);
            outline: none;
            box-shadow: 0 10px 22px rgba(148, 163, 184, 0.16);
            font-size: 1rem;
        }
        .text-input:focus { border-color: #10B981; box-shadow: 0 0 0 4px rgba(16,185,129,0.18), 0 12px 22px rgba(148, 163, 184, 0.18); }
        .inline-blank-input {
            display: inline-block;
            width: clamp(140px, 24vw, 240px);
            min-width: 140px;
            max-width: 100%;
            margin: 4px 0;
            text-align: center;
            vertical-align: middle;
        }
        .question-controls { margin-top: 14px; display: flex; justify-content: center; align-items: center; gap: 14px; flex-wrap: wrap; }
        .option {
            appearance: none;
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
            min-height: 76px;
            padding: 15px 22px 15px 60px;
            margin: 0;
            border-radius: 18px;
            cursor: pointer;
            background: linear-gradient(135deg, rgba(239,246,255,0.98), rgba(236,253,245,0.98));
            transition: transform 140ms ease, box-shadow 140ms ease, background 140ms ease, border-color 140ms ease, filter 140ms ease;
            border: 1px solid rgba(59, 130, 246, 0.24);
            box-shadow: 0 12px 28px rgba(148, 163, 184, 0.18);
            user-select: none;
            text-align: left;
            color: #0f172a;
            font: inherit;
            font-size: 1rem;
            font-weight: 600;
            line-height: 1.5;
            letter-spacing: 0.01em;
            overflow: hidden;
        }
        .option::before {
            content: attr(data-choice-label);
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 30px;
            height: 30px;
            border-radius: 999px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.96);
            border: 2px solid rgba(125, 211, 252, 0.92);
            color: #0369a1;
            font-size: 0.95rem;
            font-weight: 800;
            box-shadow: 0 6px 14px rgba(14, 165, 233, 0.16);
        }
        .option::after {
            display: none;
            content: '';
        }
        .option:hover {
            background: linear-gradient(135deg, rgba(224,242,254,1), rgba(209,250,229,1));
            transform: translateY(-2px);
            box-shadow: 0 18px 34px rgba(148, 163, 184, 0.2);
            border-color: rgba(14, 165, 233, 0.44);
        }
        .option:active {
            transform: translateY(0);
            filter: brightness(0.99);
        }
        .option:focus-visible {
            outline: none;
            border-color: rgba(14, 165, 233, 0.72);
            box-shadow: 0 0 0 5px rgba(56, 189, 248, 0.18), 0 18px 34px rgba(148, 163, 184, 0.2);
        }
        .option.selected {
            background: linear-gradient(135deg, rgba(224,242,254,1), rgba(191,219,254,0.98));
            border-color: rgba(14, 165, 233, 0.72);
            box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.14), 0 16px 30px rgba(14, 165, 233, 0.18);
        }
        .option.selected::before {
            background: linear-gradient(135deg, #0ea5e9, #38bdf8);
            border-color: rgba(14, 165, 233, 0.98);
            color: #ffffff;
        }
        .option.correct {
            background: linear-gradient(135deg, rgba(220,252,231,1), rgba(167,243,208,0.98));
            border-color: rgba(16, 185, 129, 0.78);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.14), 0 18px 32px rgba(16, 185, 129, 0.16);
        }
        .option.correct::before {
            background: linear-gradient(135deg, #10b981, #34d399);
            border-color: rgba(16, 185, 129, 0.96);
            color: #ffffff;
        }
        .option.wrong {
            background: linear-gradient(135deg, rgba(254,242,242,0.98), rgba(254,226,226,0.98));
            border-color: rgba(244, 63, 94, 0.62);
            box-shadow: 0 0 0 4px rgba(244, 63, 94, 0.12), 0 16px 30px rgba(244, 63, 94, 0.12);
        }
        .option.wrong::before {
            background: linear-gradient(135deg, #fb7185, #f43f5e);
            border-color: rgba(244, 63, 94, 0.92);
            color: #ffffff;
        }
        .option:disabled,
        .option[aria-disabled="true"] {
            cursor: default;
        }
        .match-card.wrong {
            border-color: rgba(244, 63, 94, 0.8);
            background: linear-gradient(135deg, rgba(254, 226, 226, 0.98), rgba(254, 202, 202, 0.96));
            box-shadow: 0 0 0 4px rgba(244, 63, 94, 0.14), 0 16px 26px rgba(244, 63, 94, 0.12);
        }
        #score-display {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.96), rgba(239, 246, 255, 0.96));
            color: #1F2937;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 92px;
            min-height: 54px;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 1.75em;
            z-index: 50;
            box-shadow: 0 12px 26px rgba(186, 230, 253, 0.4);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(125, 211, 252, 0.85);
        }
        #score-display #score {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0;
            width: 100%;
            min-height: 100%;
        }
        #timer {
            position: fixed;
            top: 20px;
            left: 20px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.96), rgba(239, 246, 255, 0.96));
            color: #1F2937;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 1.2em;
            z-index: 50;
            backdrop-filter: blur(6px);
            border: 1px solid rgba(125, 211, 252, 0.85);
            box-shadow: 0 12px 26px rgba(186, 230, 253, 0.4);
            display: none;
        }
        #caught-fish-hud {
            position: fixed;
            top: 72px;
            left: 20px;
            display: none;
            align-items: center;
            gap: 10px;
            padding: 6px 14px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.94), rgba(224, 242, 254, 0.94));
            border: 2px solid #0ea5e9;
            border-radius: 22px;
            box-shadow: 0 10px 24px rgba(125, 211, 252, 0.35);
            backdrop-filter: blur(8px);
            z-index: 50;
            max-width: calc(100vw - 220px);
            overflow-x: auto;
            transition: transform 0.2s ease;
        }
        .hud-label {
            font-size: 0.9rem;
            font-weight: 800;
            color: #0369a1;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            user-select: none;
        }
        #caught-fish-list {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .hud-fish-item {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffffff 50%, #e0f2fe 100%);
            border: 2px solid #0ea5e9;
            box-shadow: 0 2px 8px rgba(14, 165, 233, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            animation: hudFishPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            transition: transform 0.2s ease;
        }
        .hud-fish-item:hover {
            transform: scale(1.22);
        }
        .hud-fish-item img {
            width: 28px;
            height: 28px;
            object-fit: contain;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.25));
        }
        @keyframes hudFishPop {
            0% { transform: scale(0) rotate(-20deg); opacity: 0; }
            80% { transform: scale(1.2) rotate(5deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.25; } 100% { opacity: 1; } }
        .heart { position: absolute; width: 16px; height: 16px; transform: rotate(45deg); background: #ff7ab6; }
        .heart::before, .heart::after { content: ''; position: absolute; width: 16px; height: 16px; background: #ff7ab6; border-radius: 50%; }
        .heart::before { left: -8px; }
        .heart::after { top: -8px; }
        .sparkle { position: absolute; width: 6px; height: 6px; background: #fff59d; border-radius: 50%; box-shadow: 0 0 8px rgba(255,245,157,0.9); }
        #game-over {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(239,246,255,0.76), rgba(219,234,254,0.84));
            z-index: 200;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: #0F172A;
            text-align: center;
            backdrop-filter: blur(6px);
        }
        #final-score {
            font-size: 2.5em;
            color: #10B981;
            margin: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 56px;
            line-height: 1;
            vertical-align: middle;
        }

        /* Water Splash Ripple Animation Effect */
        .splash-ring {
            position: absolute;
            pointer-events: none;
            z-index: 120;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.95);
            box-shadow: 0 0 22px rgba(56, 189, 248, 0.95), inset 0 0 14px rgba(255, 255, 255, 0.85);
            transform: translate(-50%, -50%) scale(0.2);
            animation: splashExpand 0.6s cubic-bezier(0.1, 0.85, 0.25, 1) forwards;
        }
        .splash-ring-inner {
            position: absolute;
            pointer-events: none;
            z-index: 119;
            border-radius: 50%;
            border: 2px solid rgba(186, 230, 253, 0.9);
            box-shadow: 0 0 12px rgba(14, 165, 233, 0.8);
            transform: translate(-50%, -50%) scale(0.1);
            animation: splashExpand 0.45s cubic-bezier(0.1, 0.85, 0.25, 1) 0.06s forwards;
        }
        @keyframes splashExpand {
            0% {
                transform: translate(-50%, -50%) scale(0.15);
                opacity: 1;
                border-width: 4px;
            }
            60% {
                opacity: 0.85;
            }
            100% {
                transform: translate(-50%, -50%) scale(2.8);
                opacity: 0;
                border-width: 1px;
            }
        }
        .splash-particle {
            position: absolute;
            pointer-events: none;
            z-index: 121;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffffff 40%, #7dd3fc 100%);
            box-shadow: 0 0 8px #38bdf8;
            transform: translate(-50%, -50%);
            animation: dropletFly 0.55s ease-out forwards;
        }
        @keyframes dropletFly {
            0% {
                transform: translate(-50%, -50%) translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) translate(var(--dx), var(--dy)) scale(0.2);
                opacity: 0;
            }
        }
        .catch-text-badge {
            position: absolute;
            pointer-events: none;
            z-index: 125;
            font-family: system-ui, -apple-system, sans-serif;
            font-weight: 800;
            font-size: 1.25rem;
            color: #ffffff;
            text-shadow: 0 2px 8px rgba(2, 132, 199, 0.9), 0 0 12px #38bdf8;
            transform: translate(-50%, -50%) scale(0.5);
            animation: catchPop 0.8s cubic-bezier(0.17, 0.89, 0.32, 1.28) forwards;
        }
        @keyframes catchPop {
            0% {
                transform: translate(-50%, -50%) scale(0.4) translateY(0);
                opacity: 0;
            }
            30% {
                transform: translate(-50%, -50%) scale(1.15) translateY(-15px);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) scale(1) translateY(-40px);
                opacity: 0;
            }
        }
        .btn {
            padding: 12px 30px;
            font-size: 1.1em;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s;
            box-shadow: 0 12px 26px rgba(125, 211, 252, 0.34);
        }
        #restart-btn {
            background-color: #10B981;
            color: white;
        }
        #restart-btn:hover {
            background-color: #059669;
            transform: translateY(-2px);
        }
        #explanation {
            margin-top: 20px;
            padding: 14px 14px;
            background: linear-gradient(135deg, rgba(255,255,255,0.96), rgba(239,246,255,0.96));
            border: 1px solid rgba(125, 211, 252, 0.55);
            border-left: 6px solid #10B981;
            border-radius: 14px;
            display: none;
            box-shadow: 0 14px 28px rgba(148, 163, 184, 0.18);
            max-height: min(220px, 30vh);
            overflow: auto;
        }
        #explanation .explain-head { font-weight: 800; color: #065F46; margin-bottom: 6px; letter-spacing: 0.2px; }
        #explanation .explain-body { line-height: 1.6; color: #0F172A; opacity: 0.95; }
        #explanation .answer-head {
            margin-bottom: 6px;
            font-weight: 800;
            color: #075985;
            letter-spacing: 0.2px;
        }
        #explanation .answer-body {
            line-height: 1.55;
            color: #0f172a;
            background: linear-gradient(135deg, rgba(224,242,254,0.95), rgba(236,253,245,0.95));
            border: 1px solid rgba(125, 211, 252, 0.6);
            border-radius: 12px;
            padding: 10px 12px;
            margin-bottom: 12px;
            font-weight: 700;
        }
        #explanation .answer-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        #explanation .answer-item {
            padding: 8px 10px;
            border-radius: 10px;
            background: rgba(255,255,255,0.82);
            border: 1px solid rgba(147, 197, 253, 0.42);
        }
        .game-over-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.97), rgba(239,246,255,0.96));
            border: 1px solid rgba(125, 211, 252, 0.55);
            border-radius: 18px;
            padding: 24px 26px;
            width: min(560px, 92vw);
            box-shadow: 0 20px 44px rgba(148, 163, 184, 0.24);
            backdrop-filter: blur(10px);
            color: #0F172A;
        }
        .game-over-card h1 { margin: 0 0 10px; font-size: 28px; }
        .game-over-card .score-line {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin: 10px auto 2px;
            font-size: 16px;
            opacity: 0.92;
            white-space: nowrap;
        }
        .game-over-card .score-label {
            display: inline-flex;
            align-items: center;
            font-size: 1.25rem;
            font-weight: 700;
            line-height: 1;
            color: #1f2937;
        }
        @media (max-width: 720px) {
            #options-container.options-grid { grid-template-columns: 1fr; }
        }
    </style>
    <style>
        /* Mobile Responsiveness Improvements */
        @media (max-width: 768px) {
            #question-panel {
                width: 95% !important;
                max-width: none !important;
                padding: 16px !important;
            }
            #question-text {
                font-size: 1.2em !important;
            }
            .option {
                min-height: 68px !important;
                padding: 14px 18px 14px 54px !important;
                font-size: 0.98em !important;
            }
            /* Adjust HUD */
            #hud-score, #hud-timer {
                font-size: 1.2em !important;
                padding: 6px 12px !important;
            }
            #hud-timer {
                top: 60px !important;
                right: 16px !important;
            }
            /* Make fish easier to tap */
            .fish {
                padding: 10px; /* Increase touch area */
                margin: -10px;
            }
            .matching-board {
                gap: 36px;
                padding-inline: 4px;
            }
            .match-card {
                min-height: 52px;
                padding: 10px 12px;
                font-size: 0.92rem;
            }
            #question-fish-badge {
                width: 56px;
                height: 56px;
                right: 12px;
            }
            #question-text {
                padding: 0 72px 0 12px;
            }
        }
        
        /* Landscape on Mobile optimization */
        @media (max-height: 500px) and (orientation: landscape) {
            #question-panel {
                top: 50%;
                transform: translate(-50%, -50%) scale(0.9);
                max-height: 90vh;
                overflow-y: auto;
            }
            .seaweed { height: 50px !important; }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div class="rays"></div>

        <div id="score-display" aria-label="{{ i18n_score }}"><span id="score">0</span></div>
        <div id="timer">{{ i18n_time }}: <span id="time">60</span>s</div>
        <div id="caught-fish-hud">
            <div class="hud-label">🐟 <span id="caught-count">0</span></div>

        <div class="vignette"></div>
        <div id="hud-debug" style="position:absolute; left:8px; bottom:8px; color:#0f172a; font-size:11px; z-index:50; background:rgba(255,255,255,0.78); border:1px solid rgba(147,197,253,0.55); padding:4px 6px; border-radius:8px; display:none"></div>
    </div>

    <div id="question-panel">
        <div id="question-timer">30s</div>

        <div class="question-controls">
            <button id="submit-btn" class="btn" style="display:none; background-color:#10B981; color:#fff;">{{ i18n_submit }}</button>

    </div>

        <div id="start-overlay" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg, rgba(239,246,255,0.72), rgba(219,234,254,0.82));z-index:200;backdrop-filter:blur(6px);">
        <div style="background:rgba(255,255,255,0.96);border:1px solid rgba(16,185,129,0.45);color:#0F172A;border-radius:16px;padding:20px 26px;text-align:center;backdrop-filter:blur(6px);box-shadow:0 18px 40px rgba(148,163,184,0.24);max-width:520px;">
            <div style="font-weight:700;font-size:20px;margin-bottom:10px">{{ i18n_start_title }}</div>
            <p style="font-size:14px;margin-bottom:16px;">{{ i18n_start_rules }}</p>
            <button id="start-btn" class="btn" style="background:#10B981;color:#fff;border-radius:999px;padding-inline:32px" title="{{ i18n_start_rules }}">{{ i18n_start_button }}</button>
        </div>
    </div>

    <audio id="bgm" loop>
        <source src="" type="audio/mpeg">
        {{ i18n_audio_not_supported }}
    </audio>
    <audio id="click-sound">
        <source src="" type="audio/wav">
    </audio>
    <audio id="correct-sound">
        <source src="" type="audio/wav">
    </audio>
    <audio id="wrong-sound">
        <source src="" type="audio/wav">
    </audio>

    <script>
        // Game configuration
        const config = {
            fishCount: 10,
            baseSpeed: 2.0,
            timeLimit: 60, // seconds
            showExplanations: true,
            randomizeQuestions: true,
            exportMode: 'student'
        };

        // Game state
        let score = 0;
        let timeLeft = config.timeLimit;
        let gameActive = false;
        let timerInterval;
        let questionTimer = null;
        let questionTimeLeft = 0;
        let currentQuestionIndex = -1;
        let currentQuestionType = 'multiple_choice';
        let questions = [];
        let fishSprites = [];
        let activeFish = [];
        let bubbles = [];
        let lastTime = 0;
        let customBackgroundSet = false;
        let seaweedsStatic = [];
        let seaweedsFloating = [];
        let tinyFish = [];
        let jellies = [];
        let ambient = [];
        let bgFishObjects = [];

        // DOM elements
        const gameContainer = document.getElementById('game-container');
        const layerFar = document.getElementById('layer-far');
        const layerMid = document.getElementById('layer-mid');
        const layerNear = document.getElementById('layer-near');
        const layerBottom = document.getElementById('layer-bottom');
        const background = document.getElementById('background');
        const scoreDisplay = document.getElementById('score');
        const timerDisplay = document.getElementById('time');
        const questionPanel = document.getElementById('question-panel');
        const questionText = document.getElementById('question-text');
        const questionImageContainer = document.getElementById('question-image-container');
        const questionImage = document.getElementById('question-image');
        const optionsContainer = document.getElementById('options-container');
        const submitBtn = document.getElementById('submit-btn');
        const continueBtn = document.getElementById('continue-btn');
        const submitBtnDefaultText = submitBtn ? submitBtn.textContent : '';
        const explanationDiv = document.getElementById('explanation');
        const gameOverScreen = document.getElementById('game-over');
        const finalScore = document.getElementById('final-score');
        const restartBtn = document.getElementById('restart-btn');
        const bgm = document.getElementById('bgm');
        const clickSound = document.getElementById('click-sound');
        const correctSound = document.getElementById('correct-sound');
        const wrongSound = document.getElementById('wrong-sound');
        const feedbackSoundPools = { correct: [], wrong: [] };
        const feedbackSoundLastIndex = { correct: -1, wrong: -1 };
        let hudMap = {};
        let sceneAssetMap = {};
        const waterSound = clickSound;
        let matchingState = null;
        let lastSelectedIndex = null;
        let teachingMode = false;

        function normalizeFeedbackAudioSrc(value) {
            try {
                const src = String(value || '').trim();
                if (!src) return '';
                if (src.startsWith('data:')) return src;
                return `data:audio/wav;base64,${src}`;
            } catch (e) {
                return '';
            }
        }

        function createFeedbackSoundEntry(item) {
            try {
                if (!item) return null;
                const rawSrc = typeof item === 'string' ? item : (item.src || item.audio || item.url || '');
                const src = normalizeFeedbackAudioSrc(rawSrc);
                if (!src) return null;
                const audio = new Audio(src);
                audio.preload = 'auto';
                return { audio };
            } catch (e) {
                return null;
            }
        }

        function initFeedbackSoundPools(rawPools) {
            try {
                feedbackSoundPools.correct = (Array.isArray(rawPools && rawPools.correct) ? rawPools.correct : [])
                    .map(createFeedbackSoundEntry)
                    .filter(Boolean);
                feedbackSoundPools.wrong = (Array.isArray(rawPools && rawPools.wrong) ? rawPools.wrong : [])
                    .map(createFeedbackSoundEntry)
                    .filter(Boolean);
            } catch (e) {
                feedbackSoundPools.correct = [];
                feedbackSoundPools.wrong = [];
            }
        }

        function pickFeedbackSoundEntry(kind) {
            try {
                const pool = feedbackSoundPools[kind] || [];
                if (!pool.length) return null;
                if (pool.length === 1) {
                    feedbackSoundLastIndex[kind] = 0;
                    return pool[0];
                }
                let nextIndex = Math.floor(Math.random() * pool.length);
                if (nextIndex === feedbackSoundLastIndex[kind]) {
                    nextIndex = (nextIndex + 1 + Math.floor(Math.random() * (pool.length - 1))) % pool.length;
                }
                feedbackSoundLastIndex[kind] = nextIndex;
                return pool[nextIndex];
            } catch (e) {
                return null;
            }
        }

        function playFeedbackCue(kind) {
            try {
                const entry = pickFeedbackSoundEntry(kind);
                if (entry && entry.audio) {
                    try {
                        const fallback = kind === 'correct' ? correctSound : wrongSound;
                        entry.audio.volume = Number(fallback && fallback.volume) || 1;
                    } catch (e) {}
                    playSound(entry.audio);
                    return;
                }
            } catch (e) {}
            playSound(kind === 'correct' ? correctSound : wrongSound);
        }

        function defaultAssetPath(assetName) {
            return `../kenney_platformer-kit/PNG/Default/${assetName}`;
        }

        function localAssetPath(assetName) {
            return `kenney_platformer-kit/PNG/Default/${assetName}`;
        }

        function inferAssetName(value) {
            try {
                if (!value || typeof value !== 'string' || value.startsWith('data:')) return '';
                const clean = value.split('?')[0].split('#')[0];
                const parts = clean.split('/');
                return parts[parts.length - 1] || '';
            } catch (e) {
                return '';
            }
        }

        function setImageSource(img, candidates) {
            if (!img) return;
            const queue = [];
            (candidates || []).forEach(candidate => {
                if (typeof candidate !== 'string' || !candidate) return;
                if (!queue.includes(candidate)) queue.push(candidate);
            });
            if (!queue.length) return;
            let idx = 0;
            img.onerror = () => {
                idx += 1;
                if (idx < queue.length) {
                    img.src = queue[idx];
                    return;
                }
                img.onerror = null;
            };
            img.src = queue[idx];
        }

        function setSceneImage(img, assetName, explicitPath = '') {
            const embedded = assetName ? sceneAssetMap[assetName] : '';
            const candidates = [];
            if (embedded) candidates.push(embedded);
            if (explicitPath) candidates.push(explicitPath);
            if (assetName) {
                candidates.push(defaultAssetPath(assetName));
                candidates.push(localAssetPath(assetName));
            }
            setImageSource(img, candidates);
        }

        function getHudGlyphCandidates(token) {
            const key = String(token || '');
            const candidates = [];
            if (hudMap && hudMap[key]) candidates.push(hudMap[key]);

            const assetNames = {
                percent: 'hud_percent.png',
                plus: 'hud_plus.png',
                colon: 'hud_colon.png',
                dot: 'hud_dot.png'
            };
            const assetName = (/^\d$/.test(key)) ? `hud_number_${key}.png` : assetNames[key];
            if (assetName) {
                candidates.push(defaultAssetPath(assetName));
                candidates.push(localAssetPath(assetName));
            }
            return candidates.filter(Boolean);
        }

        // Load game configuration from URL parameters or use defaults
        function loadConfig() {
            const urlParams = new URLSearchParams(window.location.search);
            
            // Load game settings
            config.fishCount = parseInt(urlParams.get('fishCount')) || 10;
            config.baseSpeed = parseFloat(urlParams.get('baseSpeed')) || 2.0;
            config.timeLimit = parseInt(urlParams.get('timeLimit')) || 60;
            config.showExplanations = urlParams.get('showExplanations') !== 'false';
            config.randomizeQuestions = urlParams.get('randomizeQuestions') !== 'false';
            config.exportMode = String(urlParams.get('exportMode') || 'student').toLowerCase() === 'teaching' ? 'teaching' : 'student';

            try {
                const gameDataElement = document.getElementById('game-data');
                const gameData = gameDataElement ? JSON.parse(gameDataElement.textContent) : null;
                const cfg = gameData ? (gameData.game_config || {}) : {};
                hudMap = cfg.hud_digits_base64 || {};
                sceneAssetMap = cfg.scene_asset_map_base64 || {};
                if (typeof cfg.fish_count !== 'undefined') {
                    const fc = parseInt(cfg.fish_count);
                    if (!isNaN(fc) && fc > 0) config.fishCount = fc;
                }
                // Per-question time (falls back to 30s)
                if (typeof cfg.question_time !== 'undefined') {
                    const qt = parseInt(cfg.question_time);
                    if (!isNaN(qt) && qt > 0) config.questionTime = qt;
                } else {
                    config.questionTime = 30;
                }
                if (typeof cfg.base_speed !== 'undefined') {
                    const bs = parseFloat(cfg.base_speed);
                    if (!isNaN(bs) && bs > 0) config.baseSpeed = bs;
                }
                if (typeof cfg.time_limit !== 'undefined') {
                    const tl = parseInt(cfg.time_limit);
                    if (!isNaN(tl) && tl > 0) config.timeLimit = tl;
                }
                if (typeof cfg.show_explanations !== 'undefined') {
                    config.showExplanations = !!cfg.show_explanations;
                }
                if (typeof cfg.randomize_questions !== 'undefined') {
                    config.randomizeQuestions = !!cfg.randomize_questions;
                }
                if (typeof cfg.export_mode !== 'undefined') {
                    config.exportMode = String(cfg.export_mode || 'student').toLowerCase() === 'teaching' ? 'teaching' : 'student';
                }
            } catch (e) {}
            teachingMode = config.exportMode === 'teaching';
            
            // Set background
            const bgImageParam = urlParams.get('background');
            const bgImage = bgImageParam || 'background_seaweed_a.png';
            try {
                const gameDataElement = document.getElementById('game-data');
                const gameData = gameDataElement ? JSON.parse(gameDataElement.textContent) : null;
                const bgBase64 = gameData && gameData.game_config ? gameData.game_config.background_image_base64 : null;
                if (bgBase64 && typeof bgBase64 === 'string' && bgBase64.length > 50) {
                    background.src = bgBase64.startsWith('data:') ? bgBase64 : `data:image/png;base64,${bgBase64}`;
                    customBackgroundSet = true;
                } else {
                    setSceneImage(background, bgImage);
                    customBackgroundSet = !!bgImageParam;
                }
            } catch (e) {
                setSceneImage(background, bgImage);
                customBackgroundSet = !!bgImageParam;
            }
            
            // Set audio
            try {
                const gameDataElement = document.getElementById('game-data');
                const gameData = gameDataElement ? JSON.parse(gameDataElement.textContent) : null;
                const cfg = gameData ? (gameData.game_config || {}) : {};
                // Cute effects toggle
                window.enableCute = !!cfg.cute_effects;
                // Fish size mapping
                window.fishSizeSetting = (cfg.fish_size || 'Vừa');
                const bgm64 = cfg.bgm_base64;
                const click64 = cfg.click_sound_base64;
                const correct64 = cfg.correct_sound_base64;
                const wrong64 = cfg.wrong_sound_base64;
                bgm.src = (bgm64 && bgm64.length > 50) ? (bgm64.startsWith('data:') ? bgm64 : `data:audio/mpeg;base64,${bgm64}`) : '../sound/background.mp3';
                clickSound.src = (click64 && click64.length > 20) ? (click64.startsWith('data:') ? click64 : `data:audio/wav;base64,${click64}`) : '../sound/click.wav';
                correctSound.src = (correct64 && correct64.length > 20) ? (correct64.startsWith('data:') ? correct64 : `data:audio/wav;base64,${correct64}`) : '../sound/correct.wav';
                wrongSound.src = (wrong64 && wrong64.length > 20) ? (wrong64.startsWith('data:') ? wrong64 : `data:audio/wav;base64,${wrong64}`) : '../sound/wrong.wav';
                initFeedbackSoundPools(cfg.feedback_sound_pools || {});
            } catch (e) {
                bgm.src = '../sound/background.mp3';
                clickSound.src = '../sound/click.wav';
                correctSound.src = '../sound/correct.wav';
                wrongSound.src = '../sound/wrong.wav';
                initFeedbackSoundPools(null);
            }
            
            // Set volume
            bgm.volume = 0.5;
            
            // Load questions from data attribute or use sample questions
            try {
                const gameDataElement = document.getElementById('game-data');
                if (gameDataElement) {
                    const gameData = JSON.parse(gameDataElement.textContent);
                    const rawQ = gameData.questions || [];
                    questions = rawQ.map(q => {
                        const src = (q && typeof q === 'object') ? q : {};
                        const normalizedType = normalizeFishingQuestionType(src);
                        const textAnswers = collectFishingTextAnswers(src);
                        return {
                            ...src,
                            question: getFishingQuestionText(src),
                            options: src.options || src.choices || [],
                            correctAnswer: (typeof src.correctAnswer !== 'undefined') ? src.correctAnswer : (typeof src.correct_answer !== 'undefined' ? src.correct_answer : (typeof src.correctIndex !== 'undefined' ? src.correctIndex : 0)),
                            explanation: src.explanation || src.feedback || '',
                            type: normalizedType,
                            answers: textAnswers,
                            correct_answers: textAnswers,
                            match_pairs: src.match_pairs || src.pairs || src.matchPairs || []
                        };
                    });
                    
                    // If no questions provided, create some sample questions
                    if (questions.length === 0) {
                        questions = [
                            {
                                question: "What is 2 + 2?",
                                options: ["3", "4", "5"],
                                correctAnswer: 1,
                                explanation: "2 + 2 = 4"
                            },
                            {
                                question: "What is the capital of France?",
                                options: ["London", "Berlin", "Paris"],
                                correctAnswer: 2,
                                explanation: "The capital of France is Paris"
                            }
                        ];
                    }
                    
                    // Randomize questions if enabled
                    if (config.randomizeQuestions) {
                        shuffleArray(questions);
                    }
                    
                    // Limit number of questions to fish count
                    questions = questions.slice(0, Math.min(questions.length, Math.max(1, config.fishCount)));

                    // Shuffle options for each question while keeping correctAnswer in sync
                    questions.forEach(q => {
                        try {
                            if (!q || !Array.isArray(q.options) || q.options.length < 2) return;
                            const original = q.options.map((opt, idx) => ({ opt, idx }));
                            shuffleArray(original);
                            q.options = original.map(o => o.opt);
                            if (typeof q.correctAnswer === 'number' &&
                                q.correctAnswer >= 0 &&
                                q.correctAnswer < original.length) {
                                const mappedIndex = original.findIndex(o => o.idx === q.correctAnswer);
                                if (mappedIndex >= 0) q.correctAnswer = mappedIndex;
                            }
                        } catch (e) {}
                    });
                }
            } catch (e) {
                console.error("Error loading game data:", e);
            }
            
            // Load fish sprites from embedded game data if available, else fall back
            try {
                const gameDataElement = document.getElementById('game-data');
                if (gameDataElement) {
                    const gameData = JSON.parse(gameDataElement.textContent);
                    const objs = (gameData.game_config && Array.isArray(gameData.game_config.fish_objects)) ? gameData.game_config.fish_objects : [];
                    if (objs.length) {
                        fishSprites = objs.map(f => ({
                            normal: f.sprite_base64 || f.sprite || defaultAssetPath('fish_blue.png'),
                            skeleton: f.wrong_sprite_base64 || f.wrong_sprite || defaultAssetPath('fish_blue_skeleton.png')
                        }));
                    }
                    const tiny64 = (gameData.game_config && Array.isArray(gameData.game_config.tiny_fish_base64)) ? gameData.game_config.tiny_fish_base64 : [];
                    window.tinyFishSources = Array.isArray(tiny64) && tiny64.length ? tiny64 : [];
                }
            } catch (e) {}
            if (!fishSprites || fishSprites.length === 0) {
                const fishTypes = ['blue', 'green', 'pink', 'orange'];
                fishSprites = fishTypes.map(type => ({
                    normal: defaultAssetPath(`fish_${type}.png`),
                    skeleton: defaultAssetPath(`fish_${type}_skeleton.png`)
                }));
            }
            if (!window.tinyFishSources || window.tinyFishSources.length === 0) {
                window.tinyFishSources = fishSprites.map(s => s.normal);
            }
        }

        let elapsedTime = 0;

        function normalizeFishingQuestionType(question) {
            try {
                const raw = String((question && (question.type || question.question_type || question.q_type || question.kind)) || '').trim().toLowerCase();
                if (raw === 'fillblank' || raw === 'cloze' || raw === 'dien_cho_trong' || raw === 'điền_chỗ_trống') return 'fill_blank';
                if (raw === 'shortanswer' || raw === 'essay' || raw === 'tu_luan' || raw === 'tự_luận') return 'short_answer';
                if (raw === 'truefalse' || raw === 'boolean') return 'true_false';
                if (raw) return raw;
                const hasPairs = !!(question && ((Array.isArray(question.match_pairs) && question.match_pairs.length) || (Array.isArray(question.pairs) && question.pairs.length) || (Array.isArray(question.matchPairs) && question.matchPairs.length)));
                const hasTextAnswers = !!(question && ((Array.isArray(question.correct_answers) && question.correct_answers.length) || (Array.isArray(question.answers) && question.answers.length) || (question.correct_answer !== undefined && question.correct_answer !== null && String(question.correct_answer).trim() !== '') || (question.correctAnswer !== undefined && question.correctAnswer !== null && String(question.correctAnswer).trim() !== '')));
                const hasOptions = !!(question && ((Array.isArray(question.options) && question.options.length) || (Array.isArray(question.choices) && question.choices.length)));
                if (hasPairs) return 'matching';
                if (hasTextAnswers && !hasOptions) return 'fill_blank';
                return 'multiple_choice';
            } catch (e) {
                return 'multiple_choice';
            }
        }

        function getFishingQuestionText(question) {
            try {
                const raw = question && (question.question !== undefined && question.question !== null ? question.question : question.text);
                return String(raw == null ? '' : raw);
            } catch (e) {
                return '';
            }
        }

        function collectFishingTextAnswers(question) {
            try {
                const collected = [];
                const pushValues = (value) => {
                    if (Array.isArray(value)) {
                        value.forEach(item => pushValues(item));
                        return;
                    }
                    const text = String(value == null ? '' : value).trim();
                    if (text) collected.push(text);
                };
                pushValues(question && question.correct_answers);
                pushValues(question && question.answers);
                pushValues(question && question.answer_list);
                pushValues(question && question.correct_answer);
                pushValues(question && question.correctAnswer);
                return Array.from(new Set(collected));
            } catch (e) {
                return [];
            }
        }

        // Initialize the game
        function initGame() {
            // Reset game state
            score = 0;
            elapsedTime = 0;
            timeLeft = 0;
            gameActive = true;
            currentQuestionIndex = -1;
            activeFish = [];
            bubbles = [];
            seaweedsStatic = [];
            seaweedsFloating = [];
            document.querySelectorAll('.seaweed').forEach(el => el.remove());
            
            // Reset UI
            updateScore();
            updateTimer();
            gameOverScreen.style.display = 'none';
            
            // Reset caught fish HUD
            try {
                const hud = document.getElementById('caught-fish-hud');
                const list = document.getElementById('caught-fish-list');
                const countSpan = document.getElementById('caught-count');
                if (list) list.innerHTML = '';
                if (countSpan) countSpan.textContent = '0';
                if (hud) hud.style.display = 'none';
            } catch(e){}
            
            if (!customBackgroundSet) {
                applyRandomBackground();
            }
            initBubbles();
            
            createSeaweed();
            createDecorations();
            createJellies();
            createAmbientCreatures();
            // Create fish
            createFish();
            try {
                const hud = document.getElementById('hud-debug');
                hud.style.display = 'block';
                hud.textContent = `seaweed: ${seaweedsStatic.length + seaweedsFloating.length}, fish: ${activeFish.length}, jellies: ${jellies.length}`;
            } catch(e){}
            
            // Start game loop
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
            
            // Start timer
            clearInterval(timerInterval);
            timerInterval = setInterval(updateGame, 1000);
        }

        // Game loop
        function gameLoop(timestamp) {
            if (!gameActive) return;
            
            const deltaTime = (timestamp - lastTime) / 1000; // Convert to seconds
            lastTime = timestamp;
            
            // Update fish positions
            updateFish(deltaTime);
            
            // Update bubbles
            updateBubbles(deltaTime);
            updateBackgroundFish(deltaTime);
            updateSeaweed(deltaTime);
            updateTinyFish(deltaTime);
            updateJellies(deltaTime);
            updateAmbient(deltaTime);
            
            // Create new bubbles occasionally
            if (Math.random() < 0.02) {
                createBubble();
            }
            
            requestAnimationFrame(gameLoop);
        }

        function updateBackgroundFish(deltaTime) {
            const w = gameContainer.clientWidth || window.innerWidth;
            bgFishObjects.forEach(fish => {
                fish.time += deltaTime;
                const vx = fish.speed * deltaTime * 60;
                fish.x += vx;

                // Organic wave trajectory combining sine and cosine harmonics
                const wave1 = Math.sin(fish.time * fish.frequency + fish.phase) * fish.amplitude;
                const wave2 = Math.cos(fish.time * fish.secondaryFreq + fish.phase * 0.5) * (fish.amplitude * 0.35);
                const nextY = fish.startY + wave1 + wave2;
                const vy = nextY - fish.y;
                fish.y = nextY;

                if (fish.speed > 0 && fish.x > w + 60) {
                    fish.x = -60;
                } else if (fish.speed < 0 && fish.x < -60) {
                    fish.x = w + 60;
                }

                fish.element.style.left = `${fish.x}px`;
                fish.element.style.top = `${fish.y}px`;
                
                // Dynamic swimming tilt / rotation based on vertical slope
                const rawAngle = Math.atan2(vy, Math.abs(vx)) * (180 / Math.PI) * 0.65;
                const clampedAngle = Math.max(-16, Math.min(16, rawAngle));
                const flipScale = fish.speed > 0 ? 1 : -1;
                fish.element.style.transform = `scaleX(${flipScale}) rotate(${fish.speed > 0 ? clampedAngle : -clampedAngle}deg)`;
            });
        }
