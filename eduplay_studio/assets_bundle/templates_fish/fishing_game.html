                j.time += deltaTime;
                const dy = Math.sin(j.time * j.freq) * j.amp;
                const dx = Math.sin(j.time * (j.freq*0.7)) * j.sway;
                j.element.style.top = `${j.baseY + dy}px`;
                j.element.style.left = `${j.x + dx}px`;
            });
        }

        function createAmbientCreatures() {
            const containerWidth = gameContainer.clientWidth;
            const containerHeight = gameContainer.clientHeight;
            ambient = [];
            let animals = [];
            try {
                const gameData = JSON.parse(document.getElementById('game-data').textContent);
                animals = (gameData.game_config && Array.isArray(gameData.game_config.animals_base64)) ? gameData.game_config.animals_base64 : [];
            } catch(e) {}
            const count = 6 + Math.floor(Math.random()*6);
            for (let i=0;i<count;i++) {
                let el;
                if (animals.length) {
                    el = document.createElement('img');
                    el.className = 'ambient';
                    el.src = animals[Math.floor(Math.random()*animals.length)];
                    el.style.width = (10 + Math.random()*12) + 'px';
                    el.style.height = 'auto';
                } else {
                    el = document.createElement('div');
                    el.className = Math.random()<0.5 ? 'ambient star' : 'ambient dot';
                }
                const x = Math.random()*containerWidth;
                const y = 40 + Math.random()*(containerHeight*0.6);
                el.style.left = x+'px'; el.style.top = y+'px';
                (layerFar || gameContainer).appendChild(el);
                ambient.push({ element: el, x, y, baseY:y, time: Math.random()*100, amp: 6+Math.random()*10, sway: 8+Math.random()*12, speed: (0.15+Math.random()*0.15)*(Math.random()>0.5?1:-1) });
            }
        }

        function updateAmbient(deltaTime) {
            const containerWidth = gameContainer.clientWidth;
            ambient.forEach(a => {
                a.time += deltaTime;
                a.x += a.speed * deltaTime * 60;
                a.y = a.baseY + Math.sin(a.time*0.8) * a.amp;
                a.element.style.left = a.x+'px';
                a.element.style.top = a.y+'px';
                if ((a.speed>0 && a.x>containerWidth+20) || (a.speed<0 && a.x<-20)) {
                    a.x = a.speed>0? -20 : containerWidth+20;
                }
            });
        }

        function updateSeaweed(deltaTime) {
            seaweedsFloating.forEach(sw => {
                sw.time += deltaTime;
                const dy = Math.sin(sw.time * sw.frequency) * sw.amplitude;
                const dx = Math.sin(sw.time * (sw.frequency * 0.8)) * sw.sway;
                sw.y = sw.baseY + dy;
                sw.x = sw.baseX + dx;
                sw.element.style.top = `${sw.y}px`;
                sw.element.style.left = `${sw.x}px`;
            });
        }

        // Update game state
        function updateGame() {
            if (!gameActive) return;
            
            timeLeft--;
            updateTimer();
            
            if (timeLeft <= 0) {
                endGame();
            }
        }

        // Create fish elements
        function createFish() {
            const containerWidth = gameContainer.clientWidth;
            const containerHeight = gameContainer.clientHeight;
            
            // Clear existing fish
            document.querySelectorAll('.fish').forEach(fish => fish.remove());
            activeFish = [];
            
            // Create new fish
            const fishCount = Math.min(Math.max(questions.length, 1), config.fishCount);
            
            for (let i = 0; i < fishCount; i++) {
                const fishData = fishSprites[i % fishSprites.length];
                const fish = document.createElement('img');
                fish.className = 'fish';
                setImageSource(fish, [
                    fishData.normal,
                    sceneAssetMap[inferAssetName(fishData.normal)],
                    defaultAssetPath(inferAssetName(fishData.normal)),
                    localAssetPath(inferAssetName(fishData.normal))
                ]);
                
                // Size: Make clickable question fish PROMINENT & LARGE (130px - 175px)
                let minW = 130, maxW = 175;
                const fs = (window.fishSizeSetting || 'Vừa').toLowerCase();
                if (fs.includes('nhỏ')) { minW = 90; maxW = 120; }
                else if (fs.includes('lớn')) { minW = 160; maxW = 210; }
                let width = minW + Math.random() * (maxW - minW);
                width = Math.max(minW, Math.min(maxW, width));
                const height = width * 0.52;
                fish.style.width = `${width}px`;
                fish.style.height = `${height}px`;
                
                // Random position (start from left or right)
                const startFromLeft = Math.random() > 0.5;
                const x = startFromLeft ? -width : containerWidth;
                const minY = 20;
                const maxY = Math.max(minY + height, containerHeight - (height + 20));
                const y = minY + Math.random() * Math.max(20, (maxY - minY));
                
                // Random speed and movement pattern
                const speed = (0.32 + Math.random() * 0.26) * config.baseSpeed;
                const amplitude = 12 + Math.random() * 18; // Vertical movement range
                const frequency = 0.28 + Math.random() * 0.34; // Smoother vertical movement
                
                // Store fish data
                const fishObj = {
                    element: fish,
                    x,
                    y,
                    startY: y,
                    width,
                    height,
                    speed: startFromLeft ? speed : -speed,
                    amplitude,
                    frequency,
                    time: Math.random() * 100,
                    normalSprite: fishData.normal,
                    skeletonSprite: fishData.skeleton,
                    questionIndex: i % questions.length,
                    rotation: 0,
                    turnCooldown: 1.6 + Math.random() * 1.2
                };
                
                // Set initial position and direction
                updateFishElement(fishObj);
                
                // Add click event with event details for water splash effect
                fish.addEventListener('click', (e) => {
                    e.stopPropagation();
                    onFishClick(fishObj, e);
                });
                
                // Add to DOM and active fish array
                gameContainer.appendChild(fish);
                activeFish.push(fishObj);
            }
        }

        // Movement helpers
        function swimR(fish, deltaTime) {
            fish.x += Math.abs(fish.speed) * deltaTime * 60;
        }
        function swimL(fish, deltaTime) {
            fish.x -= Math.abs(fish.speed) * deltaTime * 60;
        }

        // Update fish positions
        function updateFish(deltaTime) {
            const containerWidth = gameContainer.clientWidth;
            const containerHeight = gameContainer.clientHeight;
            
            activeFish.forEach(fish => {
                if (!fish.caught) {
                    if (typeof fish.turnCooldown !== 'number') fish.turnCooldown = 0;
                    fish.turnCooldown = Math.max(0, fish.turnCooldown - deltaTime);
                    // Update position
                    if (fish.speed > 0) {
                        swimR(fish, deltaTime);
                    } else {
                        swimL(fish, deltaTime);
                    }
                    fish.time += deltaTime;
                    
                    // Update vertical position with sine wave
                    fish.y = fish.startY + Math.sin(fish.time * fish.frequency) * fish.amplitude;
                    
                    // BOUNDARY LOGIC: Turn around randomly when reaching screen edges!
                    const edgeMargin = 24;
                    if (fish.speed > 0 && fish.x >= containerWidth - fish.width - edgeMargin) {
                        fish.speed = -Math.abs(fish.speed);
                        fish.x = containerWidth - fish.width - edgeMargin;
                        const minY = 20;
                        const maxY = Math.max(minY + fish.height, containerHeight - (fish.height + 20));
                        fish.startY = minY + Math.random() * Math.max(20, (maxY - minY));
                        fish.frequency = 0.25 + Math.random() * 0.30;
                        fish.turnCooldown = 2.6 + Math.random() * 1.4;
                    } else if (fish.speed < 0 && fish.x <= edgeMargin) {
                        fish.speed = Math.abs(fish.speed);
                        fish.x = edgeMargin;
                        const minY = 20;
                        const maxY = Math.max(minY + fish.height, containerHeight - (fish.height + 20));
                        fish.startY = minY + Math.random() * Math.max(20, (maxY - minY));
                        fish.frequency = 0.25 + Math.random() * 0.30;
                        fish.turnCooldown = 2.6 + Math.random() * 1.4;
                    }
                    
                    updateFishElement(fish);
                    // Occasionally emit tiny bubble near fish mouth
                    if (Math.random() < 0.02) {
                        spawnTinyBubble(fish.x + (fish.speed>0?fish.width-8:8), fish.y + fish.height*0.35);
                    }
                } else if (fish.skeleton) {
                    // Handle sinking skeleton
                    fish.y += 2; // Sink speed
                    fish.rotation += fish.sinkRotation;
                    updateFishElement(fish);
                    
                    // Remove if off screen
                    if (fish.y > containerHeight + fish.height) {
                        fish.element.remove();
                        fish.dead = true;
                    }
                }
            });
            
            // Remove dead fish from active array
            activeFish = activeFish.filter(fish => !fish.dead);
            
            // Check if all fish have been clicked and processed
            const unansweredFish = activeFish.filter(f => !f.caught);
            if (activeFish.length === 0 && gameActive) {
                endGame();
            }
        }

        // Main game timer function called every second
        function updateGame() {
            if (!gameActive) return;
            elapsedTime += 1;
            timeLeft = elapsedTime;
            updateTimer();

            // Only end game when ALL question fish are answered
            if (activeFish.length > 0) {
                const unansweredCount = activeFish.filter(f => !f.caught).length;
                if (unansweredCount === 0) {
                    const sinkingSkeletons = activeFish.filter(f => f.skeleton && !f.dead).length;
                    if (sinkingSkeletons === 0) {
                        endGame();
                    }
                }
            }
        }

        // Update fish DOM element
        function updateFishElement(fish) {
            fish.element.style.left = `${fish.x}px`;
            fish.element.style.top = `${fish.y}px`;
            
            // Flip fish based on direction
            if (fish.speed > 0) {
                fish.element.style.transform = 'scaleX(1)';
            } else {
                fish.element.style.transform = 'scaleX(-1)';
            }
            
            // Apply rotation if sinking
            if (fish.skeleton) {
                fish.element.style.transform += ` rotate(${fish.rotation}deg)`;
            }
            // Subtle tilt based on vertical motion
            try {
                const tilt = Math.max(-8, Math.min(8, (fish.y - fish.startY) * 0.05));
                fish.element.style.transform += ` rotate(${tilt}deg)`;
            } catch(e){}
        }

        // Create water splash animation effect at click coordinates
        function createWaterSplash(x, y, isCatch = true, label = "Bắt trúng!") {
            const container = gameContainer || document.body;
            const containerRect = container.getBoundingClientRect();
            
            const relX = x - containerRect.left;
            const relY = y - containerRect.top;

            // 1. Outer Ring
            const ring = document.createElement('div');
            ring.className = 'splash-ring';
            const size = isCatch ? 75 : 55;
            ring.style.width = `${size}px`;
            ring.style.height = `${size}px`;
            ring.style.left = `${relX}px`;
            ring.style.top = `${relY}px`;
            container.appendChild(ring);

            // 2. Inner Ring
            const innerRing = document.createElement('div');
            innerRing.className = 'splash-ring-inner';
            innerRing.style.width = `${size * 0.7}px`;
            innerRing.style.height = `${size * 0.7}px`;
            innerRing.style.left = `${relX}px`;
            innerRing.style.top = `${relY}px`;
            container.appendChild(innerRing);

            // 3. Splash particles bursting radially outward
            const particleCount = isCatch ? 10 : 6;
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'splash-particle';
                const angle = (i / particleCount) * Math.PI * 2 + (Math.random() * 0.2 - 0.1);
                const distance = (isCatch ? 38 : 24) + Math.random() * 25;
                const dx = Math.cos(angle) * distance;
                const dy = Math.sin(angle) * distance - (Math.random() * 10);
                
                particle.style.setProperty('--dx', `${dx}px`);
                particle.style.setProperty('--dy', `${dy}px`);
                particle.style.left = `${relX}px`;
                particle.style.top = `${relY}px`;
                container.appendChild(particle);

                setTimeout(() => particle.remove(), 600);
            }

            // 4. Catch text badge pop up
            if (isCatch && label) {
                const badge = document.createElement('div');
                badge.className = 'catch-text-badge';
                badge.textContent = label;
                badge.style.left = `${relX}px`;
                badge.style.top = `${relY}px`;
                container.appendChild(badge);
                setTimeout(() => badge.remove(), 850);
            }

            setTimeout(() => {
                ring.remove();
                innerRing.remove();
            }, 700);
        }

        // Global missed click listener on game container to scare fish on missed clicks
        if (typeof window !== 'undefined') {
            window.addEventListener('load', () => {
                const gc = document.getElementById('game-container');
                if (gc) {
                    gc.addEventListener('click', (e) => {
                        if (!gameActive) return;
                        if (e.target.closest('#question-panel') || e.target.closest('#score-display') || e.target.closest('#timer') || e.target.closest('#start-overlay') || e.target.closest('#game-over') || e.target.closest('.fish')) {
                            return;
                        }
                        // Missed click water splash
                        createWaterSplash(e.clientX, e.clientY, false);
                        playSound(waterSound);

                        // Scare nearby fish
                        const rect = gc.getBoundingClientRect();
                        const clickX = e.clientX - rect.left;
                        const clickY = e.clientY - rect.top;

                        activeFish.forEach(fish => {
                            if (fish.caught) return;
                            const fishCenterX = fish.x + fish.width / 2;
                            const fishCenterY = fish.y + fish.height / 2;
                            const dist = Math.hypot(fishCenterX - clickX, fishCenterY - clickY);

                            if (dist < 400) {
                                // Slightly speed fish up instead of flipping direction abruptly
                                const direction = fish.speed >= 0 ? 1 : -1;
                                fish.speed = direction * Math.min(Math.abs(fish.speed) * 1.08, config.baseSpeed * 0.78);
                                const minY = 20;
                                const maxY = Math.max(minY + fish.height, gc.clientHeight - (fish.height + 20));
                                fish.startY = minY + Math.random() * Math.max(20, (maxY - minY));
                                fish.frequency = 0.24 + Math.random() * 0.24;

                                // Spawn panic bubbles
                                for (let b = 0; b < 3; b++) {
                                    spawnTinyBubble(fish.x + Math.random() * fish.width, fish.y + Math.random() * fish.height);
                                }
                            }
                        });
                    });
                }
            });
        }

        // Create bubble effect
        function createBubble(initialY = 0) {
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            
            // Size range 6px to 18px
            const size = 6 + Math.random() * 12;
            bubble.style.width = `${size}px`;
            bubble.style.height = `${size}px`;
            
            const containerW = gameContainer.clientWidth || window.innerWidth;
            const x = Math.random() * containerW;
            bubble.style.left = `${x}px`;
            bubble.style.bottom = `${initialY}px`;
            
            const speed = 40 + Math.random() * 60; // Upward pixels per second
            const wobbleSpeed = 1.2 + Math.random() * 1.8;
            const wobbleAmp = 8 + Math.random() * 18;
            const phase = Math.random() * Math.PI * 2;
            
            (layerFar || gameContainer).appendChild(bubble);
            
            const bObj = {
                element: bubble,
                startX: x,
                x: x,
                y: initialY,
                speed,
                wobbleSpeed,
                wobbleAmp,
                phase,
                time: Math.random() * 10
            };

            bubbles.push(bObj);
            return bObj;
        }

        function initBubbles() {
            // Remove previous bubbles
            bubbles.forEach(b => b.element && b.element.remove());
            bubbles = [];
            const containerH = gameContainer.clientHeight || window.innerHeight;
            
            // Initial pool of 24 floating bubbles distributed vertically
            for (let i = 0; i < 24; i++) {
                createBubble(Math.random() * containerH);
            }
        }

        function spawnTinyBubble(x, y) {
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            const size = 4 + Math.random()*4;
            bubble.style.width = `${size}px`;
            bubble.style.height = `${size}px`;
            bubble.style.left = `${x}px`;
            bubble.style.top = `${y}px`;
            gameContainer.appendChild(bubble);
            let life = 0; const duration = 1800; const step = 16;
            const vx = (Math.random()-0.5)*0.6, vy = -0.8 - Math.random()*0.6;
            const timer = setInterval(()=>{
                life += step; const t = life/duration;
                const nx = x + vx * t * 60; const ny = y + vy * t * 60;
                bubble.style.left = `${nx}px`; bubble.style.top = `${ny}px`; bubble.style.opacity = `${1-t}`;
                if (t>=1) { clearInterval(timer); bubble.remove(); }
            }, step);
        }

        // Update bubble positions
        function updateBubbles(deltaTime) {
            const containerH = gameContainer.clientHeight || window.innerHeight;
            const containerW = gameContainer.clientWidth || window.innerWidth;

            if (bubbles.length < 24) {
                createBubble(0);
            }

            bubbles.forEach(bubble => {
                bubble.time += deltaTime;
                bubble.y += bubble.speed * deltaTime;
                
                // Gentle swaying wobble
                bubble.x = bubble.startX + Math.sin(bubble.time * bubble.wobbleSpeed + bubble.phase) * bubble.wobbleAmp;
                
                bubble.element.style.bottom = `${bubble.y}px`;
                bubble.element.style.left = `${bubble.x}px`;
                
                // Opacity fades smoothly near top surface
                const maxH = containerH * 0.92;
                if (bubble.y > maxH) {
                    const fade = Math.max(0, (containerH - bubble.y) / (containerH - maxH));
                    bubble.element.style.opacity = fade;
                } else {
                    bubble.element.style.opacity = '0.85';
                }

                // Recycle bubble when it reaches top surface
                if (bubble.y > containerH + 20) {
                    bubble.y = -15;
                    bubble.startX = Math.random() * containerW;
                    bubble.x = bubble.startX;
                    bubble.speed = 40 + Math.random() * 60;
                    bubble.time = Math.random() * 10;
                }
            });
        }

        // Handle fish click
        function onFishClick(fish, e) {
            if (fish.caught) return;
            
            // Create water splash ring at click coordinates or fish center
            let splashX, splashY;
            if (e && e.clientX) {
                splashX = e.clientX;
                splashY = e.clientY;
            } else {
                const rect = gameContainer.getBoundingClientRect();
                splashX = rect.left + fish.x + fish.width / 2;
                splashY = rect.top + fish.y + fish.height / 2;
            }
            createWaterSplash(splashX, splashY, true, "Bắt trúng!");

            // Play click sound
            playSound(clickSound);
            
            // Pause game
            gameActive = false;
            
            // Show question panel with clicked fish
            showQuestion(fish.questionIndex, fish);
        }

        // Show question panel
        function showQuestion(questionIndex, clickedFish = null) {
            currentQuestionIndex = questionIndex;
            const question = questions[questionIndex];
            currentQuestionType = normalizeFishingQuestionType(question);
            try { questionPanel.classList.toggle('matching-mode', currentQuestionType === 'matching'); } catch (e) {}
            
            // Set top-right fish preview badge
            const fishBadge = document.getElementById('question-fish-badge');
            const fishImg = document.getElementById('question-fish-img');
            if (fishBadge && fishImg) {
                if (clickedFish && clickedFish.element && clickedFish.element.src) {
                    fishImg.src = clickedFish.element.src;
                    fishBadge.style.display = 'flex';
                } else {
                    fishBadge.style.display = 'none';
                }
            }

            try {
                const img64 = question.image_base64 || '';
                if (questionImageContainer && questionImage && img64) {
                    questionImage.src = img64.startsWith('data:') ? img64 : `data:image/png;base64,${img64}`;
                    questionImageContainer.style.display = 'block';
                } else if (questionImageContainer && questionImage) {
                    questionImage.src = '';
                    questionImageContainer.style.display = 'none';
                }
            } catch (e) {}
            
            // Clear previous options
            optionsContainer.innerHTML = '';
            try { optionsContainer.className = ''; } catch(e) {}
            try {
                if (submitBtn) {
                    submitBtn.style.display = 'none';
                    submitBtn.textContent = submitBtnDefaultText;
                    submitBtn.style.backgroundColor = '#10B981';
                    submitBtn.style.color = '#fff';
                    submitBtn.onclick = null;
                }
            } catch(e) {}
            try { if (continueBtn) { continueBtn.style.display = 'none'; continueBtn.onclick = null; } } catch(e) {}
            lastSelectedIndex = null;
            let questionInlineInput = null;
            
            if (currentQuestionType === 'multiple_choice') {
                try { optionsContainer.className = 'options-grid'; } catch(e) {}
                (question.options || []).forEach((option, index) => {
                    const optionElement = createChoiceOption(option, index, () => { handleChoiceAttempt(index); });
                    optionsContainer.appendChild(optionElement);
                });
            } else if (currentQuestionType === 'true_false') {
                try { optionsContainer.className = 'options-grid'; } catch(e) {}
                const tfOptions = resolveTrueFalseMeta(question).options;
                tfOptions.forEach((option, index) => {
                    const el = createChoiceOption(option, index, ()=>{ handleChoiceAttempt(index); });
                    optionsContainer.appendChild(el);
                });
            } else if (currentQuestionType === 'fill_blank') {
                try { optionsContainer.className = 'options-stack'; } catch(e) {}
                const input = document.createElement('input');
                input.type = 'text';
                input.id = 'fill-input';
                input.className = 'text-input inline-blank-input';
                questionInlineInput = input;
                try {
                    if (submitBtn) {
                        submitBtn.style.display = 'inline-block';
                        submitBtn.textContent = submitBtnDefaultText;
                        submitBtn.style.backgroundColor = '#10B981';
                        submitBtn.style.color = '#fff';
                        submitBtn.onclick = submitAnswer;
                    }
                } catch(e) {}
                try { input.focus(); } catch(e) {}
                input.addEventListener('keydown', (e) => { try { if (e.key === 'Enter' && submitBtn) { e.preventDefault(); submitBtn.click(); } } catch(ex) {} });
            } else if (currentQuestionType === 'short_answer') {
                try { optionsContainer.className = 'options-stack text-answer-layout'; } catch(e) {}
                const inputWrap = document.createElement('div');
                inputWrap.className = 'text-answer-wrap';
                const input = document.createElement('input');
                input.type = 'text'; input.id = 'fill-input'; input.className = 'text-input';
                inputWrap.appendChild(input);
                optionsContainer.appendChild(inputWrap);
                try {
                    if (submitBtn) {
                        submitBtn.style.display = 'inline-block';
                        submitBtn.textContent = submitBtnDefaultText;
                        submitBtn.style.backgroundColor = '#10B981';
                        submitBtn.style.color = '#fff';
                        submitBtn.onclick = submitAnswer;
                    }
                } catch(e) {}
                try { input.focus(); } catch(e) {}
                input.addEventListener('keydown', (e) => { try { if (e.key === 'Enter' && submitBtn) { e.preventDefault(); submitBtn.click(); } } catch(ex) {} });
            } else if (currentQuestionType === 'matching') {
                try { optionsContainer.className = 'options-stack'; } catch(e) {}
                let pairs = question.match_pairs || [];
                if (!pairs.length && Array.isArray(question.options)) {
                    pairs = question.options.filter(p=>typeof p==='object' && p && ('left' in p) && ('right' in p));
                }
                buildMatchingBoard(pairs);
                try {
                    if (submitBtn) {
                        submitBtn.style.display = teachingMode ? 'none' : 'inline-block';
                        submitBtn.textContent = submitBtnDefaultText;
                        submitBtn.style.backgroundColor = '#10B981';
                        submitBtn.style.color = '#fff';
                        submitBtn.onclick = () => {
                            if (!allMatchingPairsConnected()) {
                                return;
                            }
                            let ok = true;
                            for (let i = 0; i < pairs.length; i++) {
                                const pickedRightIndex = matchingState ? matchingState.connectionsByLeft[i] : undefined;
                                const expectedRight = normalizeText((pairs[i] && pairs[i].right) || '');
                                const pickedRight = normalizeText((pairs[pickedRightIndex] && pairs[pickedRightIndex].right) || '');
                                if (!expectedRight || pickedRight !== expectedRight) { ok = false; break; }
                            }
                            applyResult(ok);
                        };
                    }
                } catch(e) {}
            } else {
                // Fallback to multiple choice
                try { optionsContainer.className = 'options-grid'; } catch(e) {}
                (question.options || []).forEach((option, index) => {
                    const optionElement = createChoiceOption(option, index, () => { checkAnswer(index); });
                    optionsContainer.appendChild(optionElement);
                });
            }
            renderQuestionPrompt(question, questionInlineInput);
            try { if (questionInlineInput) questionInlineInput.focus(); } catch (e) {}
            
            // Show question panel
            questionPanel.style.display = 'block';
            try { questionPanel.classList.remove('open'); void questionPanel.offsetWidth; questionPanel.classList.add('open'); } catch(e) {}
            // Start per-question countdown
            try {
                stopQuestionCountdown();
                const qlim = (typeof question.time_limit !== 'undefined') ? parseInt(question.time_limit) : parseInt(config.questionTime || 30);
                questionTimeLeft = isNaN(qlim) || qlim <= 0 ? (parseInt(config.questionTime || 30)) : qlim;
                updateTimer();
                questionTimer = setInterval(() => {
                    questionTimeLeft -= 1;
                    updateTimer();
                    if (questionTimeLeft <= 0) {
                        clearInterval(questionTimer);
                        questionTimer = null;
                        timeUpQuestion();
                    }
                }, 1000);
                document.getElementById('question-timer').style.display = 'inline-block';
            } catch(e){}
            
            // Hide explanation initially
            explanationDiv.style.display = 'none';
            try { explanationDiv.innerHTML = ''; } catch(e) {}
        }

        function normalizeText(s){ try { return String(s||'').trim().toLowerCase(); } catch(e){ return String(s||''); } }

        function renderQuestionPrompt(question, inlineInput = null) {
            try {
                const rawText = getFishingQuestionText(question).trim();
                questionText.innerHTML = '';
                questionText.classList.remove('fill-blank-inline');
                if (currentQuestionType !== 'fill_blank' || !inlineInput) {
                    questionText.textContent = rawText || '___';
                    return;
                }
                const promptText = rawText || '___';
                const markerMatch = promptText.match(/_{3,}/);
                const wrap = document.createElement('span');
                wrap.className = 'question-inline-wrap';
                const appendTextPart = (text) => {
                    if (!text) return;
                    const span = document.createElement('span');
                    span.className = 'question-inline-text';
                    span.textContent = text;
                    wrap.appendChild(span);
                };
                if (markerMatch) {
                    appendTextPart(promptText.slice(0, markerMatch.index || 0));
                    wrap.appendChild(inlineInput);
                    appendTextPart(promptText.slice((markerMatch.index || 0) + markerMatch[0].length));
                } else {
                    appendTextPart(promptText);
                    wrap.appendChild(inlineInput);
                }
                questionText.classList.add('fill-blank-inline');
                questionText.appendChild(wrap);
            } catch (e) {
                try { questionText.textContent = getFishingQuestionText(question) || '___'; } catch (inner) {}
            }
        }

        function isTrueLikeLabel(value) {
            const text = normalizeText(value);
            return ['true', 'đúng', 'dung', 'yes', 'y', '1'].includes(text);
        }

        function isFalseLikeLabel(value) {
            const text = normalizeText(value);
            return ['false', 'sai', 'no', 'n', '0'].includes(text);
        }

        function resolveBooleanValue(rawValue) {
            if (typeof rawValue === 'boolean') return rawValue;
            if (typeof rawValue === 'number') return !!rawValue;
            const text = normalizeText(rawValue);
            if (isTrueLikeLabel(text)) return true;
            if (isFalseLikeLabel(text)) return false;
            return false;
        }

        function resolveTrueFalseMeta(question) {
            const fallbackTrue = '{{ i18n_true }}' || 'Đúng';
            const fallbackFalse = '{{ i18n_false }}' || 'Sai';
            let trueLabel = fallbackTrue;
            let falseLabel = fallbackFalse;
            try {
                const rawOptions = Array.isArray(question && question.options) ? question.options : [];
                rawOptions.forEach(option => {
                    if (isTrueLikeLabel(option)) trueLabel = String(option);
                    if (isFalseLikeLabel(option)) falseLabel = String(option);
                });
            } catch (e) {}
            const rawValue = (question && typeof question.correctAnswer !== 'undefined')
                ? question.correctAnswer
                : (question ? question.correct_answer : undefined);
            return {
                options: [trueLabel, falseLabel],
                correct: resolveBooleanValue(rawValue),
            };
        }

        function resetMatchingState() {
            matchingState = null;
        }

        function stopQuestionCountdown() {
            try {
                if (questionTimer) {
                    clearInterval(questionTimer);
                    questionTimer = null;
                }
            } catch (e) {}
            try { updateTimer(); } catch (e) {}
        }

        function isSubmitFlowQuestion() {
            return currentQuestionType === 'matching' || currentQuestionType === 'fill_blank' || currentQuestionType === 'short_answer';
        }

        function showContinueOnly() {
            try {
                if (submitBtn) {
                    submitBtn.style.display = 'inline-block';
                    submitBtn.textContent = continueBtn ? continueBtn.textContent : '{{ i18n_next }}';
                    submitBtn.style.backgroundColor = '#0EA5E9';
                    submitBtn.style.color = '#fff';
                    submitBtn.onclick = () => { hideQuestionPanel(); };
                }
            } catch (e) {}
            try {
                if (continueBtn) {
                    continueBtn.style.display = 'none';
                    continueBtn.onclick = null;
                }
            } catch (e) {}
        }

        function getQuestionPairs(question) {
            try {
                let pairs = question && question.match_pairs ? question.match_pairs : [];
                if ((!pairs || !pairs.length) && Array.isArray(question && question.options)) {
                    pairs = question.options.filter(p => typeof p === 'object' && p && ('left' in p) && ('right' in p));
                }
                return Array.isArray(pairs) ? pairs : [];
            } catch (e) {
                return [];
            }
        }

        function getQuestionCorrectAnswers(question) {
            try {
                if (currentQuestionType === 'matching') {
                    return getQuestionPairs(question).map(pair => `${pair.left} -> ${pair.right}`).filter(Boolean);
                }
                if (currentQuestionType === 'true_false') {
                    const meta = resolveTrueFalseMeta(question);
                    return [meta.options[meta.correct ? 0 : 1]].filter(Boolean);
                }
                if (currentQuestionType === 'multiple_choice') {
                    const options = Array.isArray(question && question.options) ? question.options : [];
                    const correctIndex = getCorrectChoiceIndex(question || {});
                    return [options[correctIndex]].filter(v => typeof v !== 'undefined' && v !== null && String(v).trim() !== '');
                }
                if (currentQuestionType === 'fill_blank' || currentQuestionType === 'short_answer') {
                    return getTextQuestionAcceptedAnswers(question);
                }
                let fallback = question && question.correctAnswer;
                if (typeof fallback === 'undefined' && question) fallback = question.correct_answer;
                return [String(fallback || '').trim()].filter(Boolean);
            } catch (e) {
                return [];
            }
        }

        function getTextQuestionAcceptedAnswers(question) {
            try {
                const collected = [];
                const pushValues = (value) => {
                    if (Array.isArray(value)) {
                        value.forEach(item => pushValues(item));
                        return;
                    }
                    const text = String(value || '').trim();
                    if (text) collected.push(text);
                };
                pushValues(question && question.correctAnswer);
                pushValues(question && question.correct_answer);
                pushValues(question && question.correct_answers);
                pushValues(question && question.answers);
                pushValues(question && question.answer_list);
                return Array.from(new Set(collected));
            } catch (e) {
                return [];
            }
        }

        function buildCorrectAnswerNode(question) {
            const answers = getQuestionCorrectAnswers(question);
            const container = document.createElement('div');
            container.className = 'answer-body';
            if (!answers.length) {
                container.textContent = '-';
                return container;
            }
            if (answers.length === 1) {
                container.textContent = answers[0];
                return container;
            }
            const list = document.createElement('div');
            list.className = 'answer-list';
            answers.forEach(answer => {
                const item = document.createElement('div');
                item.className = 'answer-item';
                item.textContent = answer;
                list.appendChild(item);
            });
            container.appendChild(list);
            return container;
        }

        function renderQuestionFeedback(question, includeCorrectAnswer) {
            try {
                explanationDiv.innerHTML = '';
                let hasContent = false;
                if (includeCorrectAnswer) {
                    const answerHead = document.createElement('div');
                    answerHead.className = 'answer-head';
                    answerHead.textContent = '{{ i18n_correct_answer }}';
                    explanationDiv.appendChild(answerHead);
                    explanationDiv.appendChild(buildCorrectAnswerNode(question || {}));
                    hasContent = true;
                }
                if (question && question.explanation && (config.showExplanations !== false)) {
                    const h = document.createElement('div');
                    h.className = 'explain-head';
                    h.textContent = '{{ i18n_explain }}';
                    const p = document.createElement('div');
                    p.className = 'explain-body';
                    p.textContent = String(question.explanation);
                    explanationDiv.appendChild(h);
                    explanationDiv.appendChild(p);
                    hasContent = true;
                }
                explanationDiv.style.display = hasContent ? 'block' : 'none';
                return hasContent;
            } catch (e) {
                return false;
            }
        }

        function shouldKeepFishOnWrongAnswer() {
            return teachingMode && currentQuestionType !== 'fill_blank' && currentQuestionType !== 'short_answer';
        }

        function turnCurrentFishIntoSkeleton() {
            if (shouldKeepFishOnWrongAnswer()) return;
            const fish = activeFish.find(f => f.questionIndex === currentQuestionIndex);
            if (!fish) return;
            fish.caught = true;
            fish.skeleton = true;
            fish.sinkRotation = (Math.random() - 0.5) * 10;
            setImageSource(fish.element, [
                fish.skeletonSprite,
                sceneAssetMap[inferAssetName(fish.skeletonSprite)],
                defaultAssetPath(inferAssetName(fish.skeletonSprite)),
                localAssetPath(inferAssetName(fish.skeletonSprite))
            ]);
            fish.element.style.cursor = 'default';
        }

        function flashWrongMatchCard(button) {
            try {
                if (!button) return;
                button.classList.remove('wrong');
                void button.offsetWidth;
                button.classList.add('wrong');
                setTimeout(() => { try { button.classList.remove('wrong'); } catch (e) {} }, 420);
            } catch (e) {}
        }

        function createSvgNode(name) {
            return document.createElementNS('http://www.w3.org/2000/svg', name);
        }

        function initMatchingState(pairs) {
            matchingState = {
                pairs: Array.isArray(pairs) ? pairs : [],
                pending: null,
                connectionsByLeft: {},
                connectionsByRight: {},
                leftButtons: [],
                rightButtons: [],
                board: null,
                svg: null
            };
            return matchingState;
        }

        function buildMatchingBoard(pairs) {
            const state = initMatchingState(pairs);
            const board = document.createElement('div');
            board.className = 'matching-board';
            board.id = 'matching-board';

            const instruction = document.createElement('div');
            instruction.className = 'matching-instruction';
            instruction.textContent = 'Chọn một mục bên trái rồi chọn mục phù hợp bên phải để nối.';
            optionsContainer.appendChild(instruction);

            const svg = createSvgNode('svg');
            svg.classList.add('match-link-layer');
            board.appendChild(svg);

            const leftColumn = document.createElement('div');
            leftColumn.className = 'matching-column';
            const leftTitle = document.createElement('div');
            leftTitle.className = 'matching-column-title';
            leftTitle.textContent = 'Vế trái';
            leftColumn.appendChild(leftTitle);

            const rightColumn = document.createElement('div');
            rightColumn.className = 'matching-column';
            const rightTitle = document.createElement('div');
            rightTitle.className = 'matching-column-title';
            rightTitle.textContent = 'Vế phải';
            rightColumn.appendChild(rightTitle);

            pairs.forEach((pair, index) => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'match-card match-card-left';
                btn.textContent = pair.left;
                btn.addEventListener('click', () => handleMatchCardClick('left', index));
                state.leftButtons[index] = btn;
                leftColumn.appendChild(btn);
            });

            const shuffledRightItems = pairs.map((pair, index) => ({ text: pair.right, index }));
            shuffleArray(shuffledRightItems);
            shuffledRightItems.forEach((item) => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'match-card match-card-right';
                btn.textContent = item.text;
                btn.addEventListener('click', () => handleMatchCardClick('right', item.index));
                state.rightButtons[item.index] = btn;
                rightColumn.appendChild(btn);
            });

            board.appendChild(leftColumn);
            board.appendChild(rightColumn);
            optionsContainer.appendChild(board);

            state.board = board;
            state.svg = svg;
            requestAnimationFrame(drawMatchingLinks);
        }

        function handleMatchCardClick(side, index) {
            if (!matchingState) return;
            const pending = matchingState.pending;
            if (pending && pending.side === side && pending.index === index) {
                matchingState.pending = null;
                updateMatchingVisualState();
                return;
            }
            if (!pending) {
                matchingState.pending = { side, index };
                updateMatchingVisualState();
                return;
            }
            if (pending.side === side) {
                matchingState.pending = { side, index };
                updateMatchingVisualState();
                return;
            }

            const leftIndex = side === 'left' ? index : pending.index;
            const rightIndex = side === 'right' ? index : pending.index;
            if (teachingMode && leftIndex !== rightIndex) {
                try { playFeedbackCue('wrong'); } catch (e) {}
                flashWrongMatchCard(matchingState.leftButtons[leftIndex]);
                flashWrongMatchCard(matchingState.rightButtons[rightIndex]);
                matchingState.pending = null;
                updateMatchingVisualState();
                return;
            }
            setMatchingConnection(leftIndex, rightIndex);
            matchingState.pending = null;
            updateMatchingVisualState();
            if (teachingMode && allMatchingPairsConnected()) {
                setTimeout(() => { applyResult(true); }, 180);
            }
        }

        function setMatchingConnection(leftIndex, rightIndex) {
            if (!matchingState) return;
            const prevRight = matchingState.connectionsByLeft[leftIndex];
            if (typeof prevRight !== 'undefined') {
                delete matchingState.connectionsByRight[prevRight];
            }
            const prevLeft = matchingState.connectionsByRight[rightIndex];
            if (typeof prevLeft !== 'undefined') {
                delete matchingState.connectionsByLeft[prevLeft];
            }
            matchingState.connectionsByLeft[leftIndex] = rightIndex;
            matchingState.connectionsByRight[rightIndex] = leftIndex;
        }

        function updateMatchingVisualState() {
            if (!matchingState) return;
            matchingState.leftButtons.forEach((button, index) => {
                if (!button) return;
                button.classList.toggle('selected', !!matchingState.pending && matchingState.pending.side === 'left' && matchingState.pending.index === index);
                button.classList.toggle('matched', typeof matchingState.connectionsByLeft[index] !== 'undefined');
            });
            matchingState.rightButtons.forEach((button, index) => {
                if (!button) return;
                button.classList.toggle('selected', !!matchingState.pending && matchingState.pending.side === 'right' && matchingState.pending.index === index);
                button.classList.toggle('matched', typeof matchingState.connectionsByRight[index] !== 'undefined');
            });
            requestAnimationFrame(drawMatchingLinks);
        }

        function drawMatchingLinks() {
            if (!matchingState || !matchingState.board || !matchingState.svg) return;
            const boardRect = matchingState.board.getBoundingClientRect();
            matchingState.svg.setAttribute('viewBox', `0 0 ${Math.max(1, boardRect.width)} ${Math.max(1, boardRect.height)}`);
            matchingState.svg.innerHTML = '';
            Object.keys(matchingState.connectionsByLeft).forEach((leftKey) => {
                const leftIndex = parseInt(leftKey, 10);
                const rightIndex = matchingState.connectionsByLeft[leftIndex];
                const leftButton = matchingState.leftButtons[leftIndex];
                const rightButton = matchingState.rightButtons[rightIndex];
                if (!leftButton || !rightButton) return;

                const leftRect = leftButton.getBoundingClientRect();
                const rightRect = rightButton.getBoundingClientRect();
                const x1 = leftRect.right - boardRect.left;
                const y1 = leftRect.top - boardRect.top + leftRect.height / 2;
                const x2 = rightRect.left - boardRect.left;
                const y2 = rightRect.top - boardRect.top + rightRect.height / 2;
                const curve = Math.max(40, Math.abs(x2 - x1) * 0.35);

                const path = createSvgNode('path');
                path.setAttribute('class', 'match-link-path');
                path.setAttribute('d', `M ${x1} ${y1} C ${x1 + curve} ${y1}, ${x2 - curve} ${y2}, ${x2} ${y2}`);
                matchingState.svg.appendChild(path);

                const startNode = createSvgNode('circle');
                startNode.setAttribute('class', 'match-link-node');
                startNode.setAttribute('cx', x1);
                startNode.setAttribute('cy', y1);
                startNode.setAttribute('r', 5);
                matchingState.svg.appendChild(startNode);

                const endNode = createSvgNode('circle');
                endNode.setAttribute('class', 'match-link-node');
                endNode.setAttribute('cx', x2);
                endNode.setAttribute('cy', y2);
                endNode.setAttribute('r', 5);
                matchingState.svg.appendChild(endNode);
            });
        }

        function allMatchingPairsConnected() {
            if (!matchingState || !Array.isArray(matchingState.pairs)) return false;
            return matchingState.pairs.length > 0 && Object.keys(matchingState.connectionsByLeft).length === matchingState.pairs.length;
        }

        function getOptionChoiceLabel(index) {
            const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            return alphabet[index] || String(index + 1);
        }

        function createChoiceOption(text, index, onClick) {
            const optionElement = document.createElement('button');
            optionElement.type = 'button';
            optionElement.className = 'option';
            optionElement.textContent = text;
            optionElement.dataset.index = index;
            optionElement.dataset.choiceLabel = getOptionChoiceLabel(index);
            optionElement.setAttribute('aria-pressed', 'false');
            optionElement.addEventListener('click', () => {
                if (optionElement.disabled) return;
                onClick();
            });
            return optionElement;
        }

        function setSelectedOption(index) {
            const optionEls = Array.from(optionsContainer.querySelectorAll('.option'));
            optionEls.forEach((el, elIndex) => {
                const isSelected = elIndex === index;
                el.classList.toggle('selected', isSelected);
                el.setAttribute('aria-pressed', isSelected ? 'true' : 'false');
            });
            return optionEls;
        }

        function disableChoiceOptions() {
            try {
                optionsContainer.querySelectorAll('.option').forEach(el => {
                    el.style.pointerEvents = 'none';
                    el.disabled = true;
                    el.setAttribute('aria-disabled', 'true');
                });
            } catch (e) {}
        }

        function getCorrectChoiceIndex(question) {
            try {
                if (currentQuestionType === 'true_false') {
                    return resolveTrueFalseMeta(question).correct ? 0 : 1;
                }
                const raw = (typeof question.correctAnswer !== 'undefined') ? question.correctAnswer : question.correct_answer;
                const idx = parseInt(raw, 10);
                return isNaN(idx) ? 0 : idx;
            } catch (e) {
                return 0;
            }
        }

        function handleChoiceAttempt(selectedIndex) {
            const question = questions[currentQuestionIndex] || {};
            lastSelectedIndex = selectedIndex;
            const optionEls = setSelectedOption(selectedIndex);
            const selectedEl = optionEls[selectedIndex];
            if (!teachingMode) {
                if (currentQuestionType === 'true_false') {
                    const val = (selectedIndex === 0);
                    applyResult(val === resolveTrueFalseMeta(question).correct);
                    return;
                }
                checkAnswer(selectedIndex);
                return;
            }
            const correctIndex = getCorrectChoiceIndex(question);
            if (selectedIndex === correctIndex) {
                applyResult(true);
                return;
            }
            try { playFeedbackCue('wrong'); } catch (e) {}
            if (selectedEl) {
                selectedEl.classList.add('wrong');
                selectedEl.style.pointerEvents = 'none';
                selectedEl.disabled = true;
                selectedEl.setAttribute('aria-disabled', 'true');
            }
        }

        function submitAnswer(){
            try {
                const q = questions[currentQuestionIndex] || {};
                if (currentQuestionType === 'fill_blank' || currentQuestionType === 'short_answer') {
                    const inp = document.getElementById('fill-input');
                    const val = normalizeText(inp ? inp.value : '');
                    const acceptedAnswers = getTextQuestionAcceptedAnswers(q);
                    const ok = acceptedAnswers.map(normalizeText).includes(val);
                    applyResult(ok);
                } else if (currentQuestionType === 'matching') {
                    let pairs = q.match_pairs || [];
                    if (!pairs.length && Array.isArray(q.options)) { pairs = q.options.filter(p=>typeof p==='object' && p && ('left' in p) && ('right' in p)); }
                    const ok = !!matchingState && pairs.length > 0 && pairs.every((p, i) => {
                        const rightIndex = matchingState.connectionsByLeft[i];
                        const picked = normalizeText((pairs[rightIndex] && pairs[rightIndex].right) || '');
                        return picked === normalizeText(p.right);
                    });
                    applyResult(ok);
                }
            } catch(e){}
        }

        // Check answer
        function checkAnswer(selectedIndex) {
            const question = questions[currentQuestionIndex];
            lastSelectedIndex = selectedIndex;
            const isCorrect = selectedIndex === question.correctAnswer;
            applyResult(isCorrect);
        }

        function applyResult(isCorrect){
            const question = questions[currentQuestionIndex];
            const shouldPauseForContinue = isSubmitFlowQuestion();
            stopQuestionCountdown();
            disableChoiceOptions();
            try {
                if (shouldPauseForContinue && submitBtn) {
                    submitBtn.style.display = 'none';
                    submitBtn.onclick = null;
                }
            } catch (e) {}
            try {
                if (currentQuestionType === 'multiple_choice' || currentQuestionType === 'true_false') {
                    const optionEls = Array.from(optionsContainer.querySelectorAll('.option'));
                    const correctIndex = getCorrectChoiceIndex(question || {});
                    if (lastSelectedIndex !== null && optionEls[lastSelectedIndex]) {
                        optionEls[lastSelectedIndex].classList.add(isCorrect ? 'correct' : 'wrong');
                    }
                    if (!isCorrect && optionEls[correctIndex]) {
                        optionEls[correctIndex].classList.add('correct');
                    }
                }
            } catch (e) {}
            if (isCorrect) {
                playFeedbackCue('correct');
                try {
                    const per = Math.max(1, Math.floor(100 / (questions.length || 1)));
                    score = Math.min(100, score + per);
                } catch(e) { score = Math.min(100, score + 100); }
                updateScore();

                // Animate fish badge flying down to top-left HUD bar
                try {
                    const fishBadge = document.getElementById('question-fish-badge');
                    const fishImg = document.getElementById('question-fish-img');
                    if (fishBadge && fishImg && fishImg.src && fishBadge.style.display !== 'none') {
                        animateFishBadgeToHud(fishBadge, fishImg.src);
                    }
                } catch(e) {}
                
                // Remove the fish
                const fish = activeFish.find(f => f.questionIndex === currentQuestionIndex);
                if (fish) {
                    fish.caught = true;
                    fish.element.style.transition = 'transform 0.5s, opacity 0.5s';
                    fish.element.style.transform = 'scale(0)';
                    fish.element.style.opacity = '0';
                    if (window.enableCute) {
                        spawnHearts(fish.x + fish.width/2, fish.y + fish.height/2);
                        spawnSparkles(fish.x + fish.width/2, fish.y + fish.height/2);
                    }
                    
                    // Remove fish after animation
                    setTimeout(() => {
                        fish.element.remove();
                        fish.dead = true;
                    }, 500);
                }
                if (renderQuestionFeedback(question, false)) {
                    showContinueOnly();
                    return;
                }
                if (shouldPauseForContinue) {
                    showContinueOnly();
                    return;
                }
            } else {
                playFeedbackCue('wrong');
                turnCurrentFishIntoSkeleton();
                if (renderQuestionFeedback(question, true) || shouldPauseForContinue) {
                    showContinueOnly();
                    return;
                }
            }
            
            // Hide panel after a delay
            setTimeout(hideQuestionPanel, isCorrect ? 500 : 1500);
        }

        // When time for the current question expires
        function timeUpQuestion() {
            stopQuestionCountdown();
            disableChoiceOptions();
            try {
                // Mark only the correct answer
                const question = questions[currentQuestionIndex];
                const options = optionsContainer.querySelectorAll('.option');
                const correctIndex = getCorrectChoiceIndex(question || {});
                if (options[correctIndex]) {
                    options[correctIndex].classList.add('correct');
                }
            } catch(e){}
            // Treat as wrong
            try {
                playFeedbackCue('wrong');
                turnCurrentFishIntoSkeleton();
            } catch(e){}
            try {
                const question = questions[currentQuestionIndex];
                if (renderQuestionFeedback(question, true)) {
                    showContinueOnly();
                    return;
                }
            } catch(e){}
            if (isSubmitFlowQuestion()) {
                showContinueOnly();
                return;
            }
            setTimeout(hideQuestionPanel, 1200);
        }

        // Hide question panel and resume game
        function hideQuestionPanel() {
            questionPanel.style.display = 'none';
            try { questionPanel.classList.remove('matching-mode'); } catch(e){}
            try { document.getElementById('question-timer').style.display = 'none'; } catch(e){}
            try { if (questionTimer) { clearInterval(questionTimer); questionTimer = null; } }catch(e){}
            try { explanationDiv.style.display = 'none'; explanationDiv.innerHTML=''; } catch(e){}
            try { if (questionImageContainer && questionImage) { questionImage.src = ''; questionImageContainer.style.display = 'none'; } } catch(e){}
            try { if (submitBtn) { submitBtn.style.display = 'none'; submitBtn.textContent = submitBtnDefaultText; submitBtn.onclick = null; } } catch(e){}
            try { if (continueBtn) { continueBtn.style.display = 'none'; continueBtn.onclick = null; } } catch(e){}
            resetMatchingState();
            lastSelectedIndex = null;
            gameActive = true;
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        // Animate fish badge flying to top-left HUD
        function animateFishBadgeToHud(fishBadge, imgSrc) {
            const hud = document.getElementById('caught-fish-hud');
            const list = document.getElementById('caught-fish-list');
            if (!hud || !list) return;

            hud.style.display = 'flex';
            const badgeRect = fishBadge.getBoundingClientRect();
            const listRect = list.getBoundingClientRect();

            // Calculate destination position inside the list
            const targetX = listRect.left + (listRect.width || 0);
            const targetY = listRect.top + (listRect.height > 0 ? listRect.height / 2 - 19 : 0);

            // Clone flying element
            const flying = document.createElement('div');
            flying.style.position = 'fixed';
            flying.style.left = `${badgeRect.left}px`;
            flying.style.top = `${badgeRect.top}px`;
            flying.style.width = `${badgeRect.width}px`;
            flying.style.height = `${badgeRect.height}px`;
            flying.style.zIndex = '300';
            flying.style.pointerEvents = 'none';
            flying.style.borderRadius = '50%';
            flying.style.background = 'radial-gradient(circle, #ffffff 50%, #e0f2fe 100%)';
            flying.style.border = '3px solid #0ea5e9';
            flying.style.boxShadow = '0 8px 24px rgba(14, 165, 233, 0.6)';
            flying.style.display = 'flex';
            flying.style.alignItems = 'center';
            flying.style.justifyContent = 'center';

            const img = document.createElement('img');
            img.src = imgSrc;
            img.style.maxWidth = '85%';
            img.style.maxHeight = '85%';
            img.style.objectFit = 'contain';
            flying.appendChild(img);
            document.body.appendChild(flying);

            // Hide original static badge on question card
            fishBadge.style.display = 'none';

            // Smooth parabolic fly animation
            try {
                flying.animate([
                    { left: `${badgeRect.left}px`, top: `${badgeRect.top}px`, width: `${badgeRect.width}px`, height: `${badgeRect.height}px`, opacity: 1, transform: 'scale(1) rotate(0deg)' },
                    { left: `${targetX}px`, top: `${targetY}px`, width: '38px', height: '38px', opacity: 1, transform: 'scale(1.15) rotate(-15deg)' }
                ], {
                    duration: 650,
                    easing: 'cubic-bezier(0.16, 1, 0.3, 1)',
                    fill: 'forwards'
                }).onfinish = () => {
                    flying.remove();
                    addFishToHudBar(imgSrc);
                };
            } catch(e) {
                flying.remove();
                addFishToHudBar(imgSrc);
            }
        }

        // Add caught fish icon to HUD list
        function addFishToHudBar(src) {
            const hud = document.getElementById('caught-fish-hud');
            const list = document.getElementById('caught-fish-list');
            const countSpan = document.getElementById('caught-count');
            if (!hud || !list) return;

            hud.style.display = 'flex';

            const item = document.createElement('div');
            item.className = 'hud-fish-item';
            const img = document.createElement('img');
            img.src = src;
            img.alt = 'Cá đã bắt';
            item.appendChild(img);
            list.appendChild(item);

            if (countSpan) countSpan.textContent = list.children.length;

            hud.style.transform = 'scale(1.1)';
            setTimeout(() => { hud.style.transform = 'scale(1)'; }, 200);
        }

        // Update score display
        function updateScore() {
            try { renderHudNumber(scoreDisplay, score, 1.25); } catch(e) { scoreDisplay.textContent = score; }
        }

        function renderHudNumber(container, value, scale){
            try {
                const s = String(Math.max(0, Math.min(9999, Math.floor(value))));
                container.innerHTML = '';
                container.style.display = 'inline-flex';
                container.style.alignItems = 'center';
                container.style.gap = '0';
                for (let i=0;i<s.length;i++){
                    const candidates = getHudGlyphCandidates(s[i]);
                    if (!candidates.length) {
                        const span = document.createElement('span');
                        span.textContent = s[i];
                        span.style.marginRight = (i < s.length - 1) ? '-0.08em' : '0';
                        container.appendChild(span);
                        continue;
                    }
                    const img = document.createElement('img');
                    const fs = parseFloat(getComputedStyle(container).fontSize) || 18;
                    const h = Math.round(fs * 1.15 * (scale||1));
                    const overlapPx = Math.max(6, Math.round(h * 0.18));
                    img.style.height = h + 'px';
                    img.style.width = 'auto';
                    img.style.marginRight = (i < s.length - 1) ? `${-overlapPx}px` : '0';
                    img.style.verticalAlign = 'middle';
                    img.style.flex = '0 0 auto';
                    setImageSource(img, candidates);
                    container.appendChild(img);
                }
            } catch(e) {}
        }

        // Update timer display
        function updateTimer() {
            // Show per-question countdown when panel is visible; else show game time
            try {
                const qVisible = questionPanel.style.display === 'block';
                const val = qVisible ? (questionTimeLeft || 0) : timeLeft;
                try { renderHudNumber(timerDisplay, val, 1.1); } catch(e) { timerDisplay.textContent = val; }
                const qt = document.getElementById('question-timer');
                if (qt) { qt.style.display = qVisible ? 'inline-block' : 'none'; qt.textContent = val + 's'; }
            } catch(e) { timerDisplay.textContent = timeLeft; }
            
            // Change color when time is running low
            const showLeft = (questionPanel.style.display === 'block') ? questionTimeLeft : timeLeft;
            if (showLeft <= 10) {
                timerDisplay.style.color = '#FF6B6B';
                timerDisplay.style.fontWeight = 'bold';
                
                // Blink effect when very low
                if (showLeft <= 5) {
                    timerDisplay.style.animation = timeLeft % 2 === 0 ? 'blink 0.5s infinite' : 'none';
                }
            } else {
                timerDisplay.style.color = '';
                timerDisplay.style.fontWeight = '';
                timerDisplay.style.animation = '';
            }
        }

        // End the game
        function endGame() {
            gameActive = false;
            clearInterval(timerInterval);
            
            // Show game over screen
            try { renderHudNumber(finalScore, score, 1.8); } catch(e) { finalScore.textContent = score; }
            gameOverScreen.style.display = 'flex';
            
            // Stop background music
            bgm.pause();
            bgm.currentTime = 0;
        }

        // Play sound effect
        function playSound(audioElement) {
            audioElement.currentTime = 0;
            audioElement.play().catch(e => console.log("Audio play failed:", e));
        }

        // Cute particles
        function spawnHearts(x, y) {
            for (let i = 0; i < 4; i++) {
                const h = document.createElement('div');
                h.className = 'heart';
                const dx = (Math.random() - 0.5) * 80;
                const dy = -20 - Math.random() * 60;
                h.style.left = `${x}px`;
                h.style.top = `${y}px`;
                h.style.opacity = '0.95';
                gameContainer.appendChild(h);
                const duration = 800 + Math.random()*400;
                const sx = x, sy = y;
                const step = 16;
                let time = 0;
                const anim = setInterval(()=>{
                    time += step;
                    const t = time/duration;
                    h.style.left = `${sx + dx * t}px`;
                    h.style.top = `${sy + dy * t}px`;
                    h.style.opacity = `${1 - t}`;
                    if (t>=1) { clearInterval(anim); h.remove(); }
                }, step);
            }
        }
        function spawnSparkles(x, y) {
            for (let i = 0; i < 6; i++) {
                const s = document.createElement('div');
                s.className = 'sparkle';
                const ang = Math.random()*Math.PI*2;
                const dist = 20 + Math.random()*40;
                s.style.left = `${x}px`;
                s.style.top = `${y}px`;
                gameContainer.appendChild(s);
                const duration = 600 + Math.random()*400;
                const step = 16; let time=0; const sx=x, sy=y;
                const vx = Math.cos(ang)*dist, vy = Math.sin(ang)*dist;
                const anim = setInterval(()=>{
                    time += step; const t = time/duration;
                    s.style.left = `${sx + vx * t}px`;
                    s.style.top = `${sy + vy * t}px`;
                    s.style.opacity = `${1 - t}`;
                    if (t>=1) { clearInterval(anim); s.remove(); }
                }, step);
            }
        }

        // Utility function to shuffle array
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // Event listeners
        restartBtn.addEventListener('click', () => {
            gameOverScreen.style.display = 'none';
            initGame();
        });

        // Initialize the game when the page loads
        window.addEventListener('load', () => {
            loadConfig();
            // Preload muted audio to satisfy autoplay policies
            try { bgm.volume = 0.0; bgm.muted = true; bgm.play().catch(()=>{}); } catch(e){}
            
            // Handle window resize
            window.addEventListener('resize', () => {
                // Recalculate fish positions if needed
                activeFish.forEach(fish => {
                    if (fish.x > gameContainer.clientWidth) {
                        fish.x = gameContainer.clientWidth - fish.width;
                    }
                    if (fish.y > gameContainer.clientHeight - fish.height) {
                        fish.y = gameContainer.clientHeight - fish.height;
                    }
                    updateFishElement(fish);
                });
                if (currentQuestionType === 'matching') {
                    requestAnimationFrame(drawMatchingLinks);
                }
            });
            const overlay = document.getElementById('start-overlay');
            const btn = document.getElementById('start-btn');
            btn.addEventListener('click', () => { try { bgm.muted = false; bgm.volume = 0.5; bgm.play().catch(()=>{});} catch(e){} overlay.style.display='none'; initGame(); });
        });
        // Remove auto-start fallback to require user start
    </script>
    <script type="text/JavaScript">
        document.oncontextmenu = function() { return false; }
        document.onselectstart = function() { return false; }
        document.oncopy = function() { return false; }
    </script>
</body>
